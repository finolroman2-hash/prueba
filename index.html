  /* ------------------------------------------------------------------ */
  function setupStacking() {

    const mm = gsap.matchMedia();
    mm.add('(min-width: 901px)', () => {

    });
  }

  /* ------------------------------------------------------------------ */
  /* Tarjeta de regalo: inclinación 3D con puntero o giroscopio           */
  /* ------------------------------------------------------------------ */
  function setupGift(reduced) {
    const gift = qs('#informacion .gift'), card = qs('#informacion .gift-card');
    if (!gift || !card) return;

    probe('assets/regalo/tarjeta.jpg').then((ok) => {
      if (!ok) return;
      const tex = qs('.gift-texture', card);
      if (tex) tex.style.backgroundImage = 'url("assets/regalo/tarjeta.jpg")';
      card.classList.add('has-texture');
    });
    if (reduced) return;

    const MAX = 10;                                   // grados
    const cur = { rx: 0, ry: 0, mx: 50, my: 50 }, tgt = { rx: 0, ry: 0, mx: 50, my: 50 };
    let raf = 0, live = false;
    const apply = () => {
      card.style.setProperty('--rx', `${cur.rx.toFixed(2)}deg`);
      card.style.setProperty('--ry', `${cur.ry.toFixed(2)}deg`);
      card.style.setProperty('--mx', `${cur.mx.toFixed(1)}%`);
      card.style.setProperty('--my', `${cur.my.toFixed(1)}%`);
    };
    const loop = () => {
      let settled = true;
      for (const k in cur) {
        cur[k] = lerp(cur[k], tgt[k], 0.12);
        if (Math.abs(cur[k] - tgt[k]) > 0.02) settled = false; else cur[k] = tgt[k];
      }
      apply();
      if (settled && !live) { raf = 0; card.classList.remove('is-live'); return; }
      raf = requestAnimationFrame(loop);
    };
    const wake = () => { card.classList.add('is-live'); if (!raf) raf = requestAnimationFrame(loop); };
    const rest = () => { live = false; tgt.rx = 0; tgt.ry = 0; tgt.mx = 50; tgt.my = 50; wake(); };

    /* Puntero */
    gift.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'touch') return;
      const r = card.getBoundingClientRect();
      const nx = clamp((e.clientX - r.left) / r.width, 0, 1), ny = clamp((e.clientY - r.top) / r.height, 0, 1);
      live = true;
      tgt.ry = (nx - 0.5) * 2 * MAX; tgt.rx = (0.5 - ny) * 2 * MAX;
      tgt.mx = nx * 100; tgt.my = ny * 100;
      wake();
    });
    gift.addEventListener('pointerleave', rest);

    /* Giroscopio: solo si el evento llega con datos (sin pedir permiso en iOS); solo con la tarjeta en pantalla */
    if (Aurea.flags.touch && 'DeviceOrientationEvent' in window) {
      let inView = false, base = null;
      const onOri = (e) => {
        if (!inView || e.gamma === null || e.beta === null) return;
        if (base === null) base = { b: e.beta, g: e.gamma };     // el reposo es la postura en que se llegó
        const g = clamp(e.gamma - base.g, -25, 25) / 25, b = clamp(e.beta - base.b, -25, 25) / 25;
        live = true;
        tgt.ry = g * MAX; tgt.rx = -b * MAX;
        tgt.mx = 50 + g * 40; tgt.my = 50 + b * 40;
        wake();
      };
      window.addEventListener('deviceorientation', onOri, { passive: true });
      if ('IntersectionObserver' in window) {
        new IntersectionObserver((es) => { inView = es[0].isIntersecting; if (!inView) { base = null; rest(); } }, { threshold: 0.2 }).observe(card);
      } else inView = true;
    }
  }

  /* ------------------------------------------------------------------ */
  /* Categorías en touch: la portada se descubre al entrar en pantalla    */
  /* ------------------------------------------------------------------ */
  function setupTouchCats() {
    if (!Aurea.flags.touch || !('IntersectionObserver' in window)) return;
    const cats = qsa('#servicios .cat');
    if (!cats.length) return;
    const io = new IntersectionObserver((es) => es.forEach((e) => {
      if (e.isIntersecting) { e.target.classList.add('is-touched'); io.unobserve(e.target); }
    }), { threshold: 0.4 });
    cats.forEach((c) => io.observe(c));
  }

  /* ------------------------------------------------------------------ */
  /* Parallax suave (solo escritorio): ±21 px con scrub                   */
  /* ------------------------------------------------------------------ */
  function setupParallax() {
    const mm = gsap.matchMedia();
    mm.add('(min-width: 901px)', () => {
      const items = [
        ...qsa('#luza-finol .fig').map((el) => ({ el, trigger: el.closest('.section') || el })),
        ...qsa('#unidades .unit-photos').map((el) => ({ el, trigger: el.closest('.unit') || el }))
      ];
      items.forEach(({ el, trigger }) => {
        el.classList.add('mo-parallax');
        gsap.fromTo(el, { y: 21 }, { y: -21, ease: 'none', scrollTrigger: { trigger, start: 'top bottom', end: 'bottom top', scrub: true } });
      });
      return () => items.forEach(({ el }) => { el.classList.remove('mo-parallax'); gsap.set(el, { clearProps: 'y' }); });
    });
  }

  /* ------------------------------------------------------------------ */
  function init() {
    const reduced = Aurea.flags.reduced || root.classList.contains('reduced');
    const hasGsap = Aurea.flags.gsap && typeof ScrollTrigger !== 'undefined';

    setupTouchCats();

    if (!hasGsap) {
      /* Sin GSAP: todo visible y estático; el CSS de base pinta fondos y marquesina */
      showAllStatic();
      setupGift(reduced);
      return;
    }

    if (reduced) {
      /* Movimiento reducido: revelados instantáneos, sin parallax ni contadores.
         El fondo cambia por zona sin interpolar: sin html.theme-scroll, base.css pinta cada zona con su color al entrar. */
      fontsReady().then(showAllStatic);
      setupGift(true);
      return;
    }

    setupBackground();
    setupCounters();
    setupMarquee();
    setupStacking();
    setupGift(false);
    setupParallax();

    /* Los textos se dividen con las fuentes ya cargadas para que las líneas sean las definitivas */
    fontsReady().then(() => {
      setupReveals();
      setupHighlight();
      ScrollTrigger.refresh();
    });

    const refresh = () => ScrollTrigger.refresh();
    on('preloader:done', () => setTimeout(refresh, 60));
    on('panel:close', () => setTimeout(refresh, 400));
    window.addEventListener('load', refresh, { once: true });
  }

  Aurea.register('motion', init);
})();

void main(){
  vec2 c = gl_PointCoord - 0.5; float d = length(c);
  float a = smoothstep(0.5, 0.12, d);
  vec3 col = vT < 0.08 ? uPerla : mix(uOroClaro, uOro, (vT - 0.08) / 0.92);
  col = mix(col, uOroClaro, (vSweep - 0.72) * 2.0);
  gl_FragColor = vec4(col, a * vAlpha * uOpacity);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

const DUST_VERT = /* glsl */`
attribute float aPhase, aSize, aT;
uniform float uTime, uPixelRatio, uRefZ;
varying float vAlpha, vT, vSweep;
void main(){
  vec3 p = position;
  p.y += sin(uTime*0.25 + aPhase*6.2832)*0.12;
  p.x += cos(uTime*0.18 + aPhase*4.0)*0.08;
  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  float tw = 0.5 + 0.5*sin(uTime*(0.6 + aPhase) + aPhase*6.2832);
  vAlpha = 0.25 + 0.5*tw; vT = 0.3 + aT; vSweep = 0.72;
  gl_PointSize = aSize*uPixelRatio*clamp(uRefZ / -mv.z, 0.3, 5.0);
  gl_Position = projectionMatrix * mv;
}`;

/* Muestrea n puntos dentro de las letras del logo (Path2D del trazado exacto; no depende de imágenes ni de CORS) */
function sampleLogo(n) {
  const W = 802, H = 121, SC = 3;
  const cv = document.createElement('canvas');
  cv.width = W * SC; cv.height = H * SC;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.scale(SC, SC);
  ctx.fillStyle = '#fff';
  ctx.fill(new Path2D(window.AUREA_LOGO_PATH), 'evenodd');
  const data = ctx.getImageData(0, 0, W * SC, H * SC).data;
  const inside = [];
  for (let y = 0; y < H * SC; y++) for (let x = 0; x < W * SC; x++) if (data[(y * W * SC + x) * 4 + 3] > 128) inside.push(x, y);
  const count = inside.length / 2;
  const out = new Float32Array(n * 2);
  const stride = count / n;
  for (let i = 0; i < n; i++) {
    const j = Math.min(count - 1, Math.floor(i * stride + Math.random() * stride));
    const px = (inside[j * 2] + Math.random()) / SC, py = (inside[j * 2 + 1] + Math.random()) / SC;
    out[i * 2] = px / W - 0.5;                 // -0,5 … 0,5 (ancho = 1)
    out[i * 2 + 1] = (0.5 - py / H) * (H / W); // proporción exacta del logo
  }
  return out;
}

async function createScene(THREE) {
  const wrap = qs('#hero-canvas-wrap');
  if (!wrap || !THREE) return null;
  const mobile = F.mobile, low = mobile || F.lowPower;
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, powerPreference: 'high-performance' });
  } catch (e) { return null; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 2));
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const canvas = renderer.domElement;
  canvas.style.opacity = '0';
  wrap.appendChild(canvas);
  root.classList.add('hero3d');

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 60);
  camera.position.set(0, 0, CAM_Z);
  camera.lookAt(0, 0, 0);

  const col = (v, fb) => new THREE.Color(cssVar(v, fb));
  const C = { perla: col('--perla', '#EEE5DF'), oro: col('--oro', '#C8A472'), oroClaro: col('--oro-claro', '#E9D5B0') };

  /* --- Partículas: disco de filotaxis → letras del wordmark → vórtice áureo --- */
  const N = mobile ? 5200 : (low ? 7000 : 9500);
  const disc = new Float32Array(N * 3), vortex = new Float32Array(N * 3), phase = new Float32Array(N), size = new Float32Array(N), tt = new Float32Array(N);
  const logo = sampleLogo(N);
  /* Permutación: cada letra se deshace hacia puntos aleatorios del vórtice */
  const perm = Array.from({ length: N }, (_, i) => i);
  for (let i = N - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  const b = Math.log(PHI) / (Math.PI / 2), theta = 4 * Math.PI, a0 = 0.05;
  for (let i = 0; i < N; i++) {
    const r = Math.sqrt((i + 0.5) / N), th = i * GOLDEN;
    disc[i * 3] = r * Math.cos(th); disc[i * 3 + 1] = r * Math.sin(th); disc[i * 3 + 2] = 0.08 * Math.sin(r * 9.0 + th) - 0.2;
    const k = perm[i] / (N - 1), ang = k * theta + (Math.random() - 0.5) * 0.35;
    const rs = a0 * Math.exp(b * ang) * (1 + (Math.random() - 0.5) * 0.22);
    vortex[i * 3] = rs * Math.cos(ang); vortex[i * 3 + 1] = rs * Math.sin(ang) * 0.85;
    vortex[i * 3 + 2] = -3.5 + k * 11.5 + (Math.random() - 0.5) * 0.6; // de lejos a más allá de la cámara
    phase[i] = Math.random();
    size[i] = (mobile ? 2.2 : 2.7) * (0.75 + Math.random() * 0.5);
    tt[i] = Math.random();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(disc, 3));
  geo.setAttribute('aLogo', new THREE.BufferAttribute(logo, 2));
  geo.setAttribute('aVortex', new THREE.BufferAttribute(vortex, 3));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('aT', new THREE.BufferAttribute(tt, 1));
  const mat = new THREE.ShaderMaterial({
    vertexShader: PARTICLE_VERT, fragmentShader: PARTICLE_FRAG, transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 }, uMorph: { value: 0 }, uUnroll: { value: 0 }, uSpin: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() }, uRefZ: { value: CAM_Z },
      uLogoWidth: { value: 3 }, uDiscR: { value: 2 }, uLogoCenter: { value: new THREE.Vector2(0, 0) }, uTiltX: { value: 0 }, uTiltY: { value: 0 }, uVortexScale: { value: 1 },
      uOro: { value: C.oro }, uOroClaro: { value: C.oroClaro }, uPerla: { value: C.perla }, uOpacity: { value: 0.68 }
    }
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  scene.add(points);

  /* --- Polvo dorado: esfera de Fibonacci amplia con parallax --- */
  const M = mobile ? 300 : 600;
  const dpos = new Float32Array(M * 3), dph = new Float32Array(M), dsz = new Float32Array(M), dt2 = new Float32Array(M);
  for (let i = 0; i < M; i++) {
    const y = 1 - (i / (M - 1)) * 2, rr = Math.sqrt(1 - y * y), th = i * GOLDEN;
    const rad = 2.4 + Math.random() * 3.2;
    let z = rr * Math.sin(th) * rad; if (z > 3.2) z = 3.2 - (z - 3.2);
    dpos[i * 3] = rr * Math.cos(th) * rad * 1.4; dpos[i * 3 + 1] = y * rad; dpos[i * 3 + 2] = z;
    dph[i] = Math.random(); dsz[i] = 1.2 + Math.random() * 1.8; dt2[i] = Math.random() * 0.6;
  }
  const dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
  dustGeo.setAttribute('aPhase', new THREE.BufferAttribute(dph, 1));
  dustGeo.setAttribute('aSize', new THREE.BufferAttribute(dsz, 1));
  dustGeo.setAttribute('aT', new THREE.BufferAttribute(dt2, 1));
  const dustMat = new THREE.ShaderMaterial({
    vertexShader: DUST_VERT, fragmentShader: PARTICLE_FRAG, transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() }, uRefZ: { value: CAM_Z }, uOro: { value: C.oro }, uOroClaro: { value: C.oroClaro }, uPerla: { value: C.perla }, uOpacity: { value: 0.5 } }
  });
  const dust = new THREE.Points(dustGeo, dustMat);
  dust.frustumCulled = false;
  scene.add(dust);

  /* --- Disposición: las letras caen exactamente sobre la caja .hero-wordmark --- */
  const base = { w: 1, h: 1, halfH: 1, halfW: 1, pxPerUnit: 1 };
  function layout() {
    const w = wrap.clientWidth || innerWidth, h = wrap.clientHeight || innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    base.halfH = CAM_Z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)); base.halfW = base.halfH * camera.aspect;
    base.pxPerUnit = h / (2 * base.halfH); base.w = w; base.h = h;
    const p = anchorPoint();
    mat.uniforms.uLogoCenter.value.set((p.x / w * 2 - 1) * base.halfW, (1 - p.y / h * 2) * base.halfH);
    mat.uniforms.uLogoWidth.value = p.w / base.pxPerUnit;
    mat.uniforms.uDiscR.value = Math.min(w, h) * 0.46 / base.pxPerUnit;
    mat.uniforms.uVortexScale.value = clamp(base.halfW / 2.75, 0.6, 1); /* en pantallas estrechas el vórtice se recoge */
    mat.uniforms.uPixelRatio.value = dustMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
    applyScroll(S.p);
  }

  /* --- Parallax sutil solo con puntero fino (en teléfono manda el scroll) --- */
  const tilt = { x: 0, y: 0, tx: 0, ty: 0 };
  if (F.finePointer) {
    window.addEventListener('pointermove', (e) => {
      const nx = (e.clientX / innerWidth) * 2 - 1, ny = -((e.clientY / innerHeight) * 2 - 1);
      tilt.tx = nx * 0.12; tilt.ty = ny * 0.12;
    }, { passive: true });
    document.addEventListener('mouseleave', () => { tilt.tx = 0; tilt.ty = 0; });
  }

  /* --- Scroll: las letras se deshacen en el vórtice y todo se desvanece --- */
  const content = qs('.hero-content'), corners = qsa('.hero-stage > .hero-corner');
  function applyScroll(p) {
    S.p = p;
    mat.uniforms.uUnroll.value = smooth(0.02, 0.72, p);
    wrap.style.opacity = String(1 - smooth(0.6, 0.95, p));
    /* El texto cede el paso al vórtice y sube levemente */
    const k = smooth(0.1, 0.42, p);
    if (content) { content.style.opacity = String(1 - k); content.style.transform = `translateY(${(-55 * k).toFixed(1)}px)`; }
    corners.forEach((c) => { c.style.opacity = String(1 - k); });
  }

  /* --- Bucle --- */
  const clock = { last: 0, t: 0 };
  function tick(now) {
    if (!S.running) { S.raf = 0; return; }
    S.raf = requestAnimationFrame(tick);
    const dt = clock.last ? Math.min(0.05, (now - clock.last) / 1000) : 0.016;
    clock.last = now; clock.t += dt;
    if (S.entryOn && S.entry < 1) { S.entry = Math.min(1, S.entry + dt / 1.44); canvas.style.opacity = String(expoOut(S.entry)); }
    tilt.x = lerp(tilt.x, tilt.tx, 0.06); tilt.y = lerp(tilt.y, tilt.ty, 0.06);
    mat.uniforms.uTiltX.value = tilt.x; mat.uniforms.uTiltY.value = tilt.y;
    dust.rotation.y = tilt.x * 0.8 + clock.t * 0.012; dust.rotation.x = -tilt.y * 0.6;
    mat.uniforms.uTime.value = clock.t; dustMat.uniforms.uTime.value = clock.t;
    /* el disco gira despacio mientras no se ha formado el wordmark */
    mat.uniforms.uSpin.value = clock.t * 0.12;
    renderer.render(scene, camera);
  }

  let rz = 0;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 80); });
  layout();

  return { THREE, renderer, canvas, scene, camera, points, mat, dust, layout, applyScroll, tick,
    start() { if (!S.raf) { clock.last = 0; S.raf = requestAnimationFrame(tick); } } };
}

/* ======================================================================
   3. Control del bucle (visibilidad, pestaña, panel)
   ====================================================================== */
function syncLoop() {
  const sc = S.scene; if (!sc) return;
  const should = S.heroVisible && !document.hidden && !S.panelOpen && !S.userPaused;
  S.running = should;
  qs('#hero-canvas-wrap')?.classList.toggle('is-off', !S.heroVisible);
  if (should) sc.start();
}
function wireLoop() {
  const hero = qs('#inicio');
  if (hero && 'IntersectionObserver' in window) {
    new IntersectionObserver((es) => { S.heroVisible = es[0].isIntersecting; syncLoop(); }, { threshold: 0 }).observe(hero);
  }
  document.addEventListener('visibilitychange', syncLoop);
  Aurea.on('panel:open', () => { S.panelOpen = true; syncLoop(); });
  Aurea.on('panel:close', () => { S.panelOpen = false; syncLoop(); });
}

/* ======================================================================
   4. Formación del wordmark (disco → letras), una sola vez tras el preloader
   ====================================================================== */
function formLogo() {
  const sc = S.scene; if (!sc || S.formed) return Promise.resolve();
  S.formed = true;
  const u = sc.mat.uniforms.uMorph;
  if (window.gsap) return new Promise((res) => gsap.to(u, { value: 1, duration: 1.89, ease: 'expo.inOut', onComplete: res }));
  return new Promise((res) => { const t0 = performance.now(); const step = (now) => { const k = clamp((now - t0) / 1890, 0, 1); u.value = easeIO(k); if (k < 1) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); });
}

/* ======================================================================
   5. Scroll (ScrollTrigger con scrub; sin GSAP, scroll nativo + rAF)
   ====================================================================== */
function wireScroll() {
  const hero = qs('#inicio'); if (!hero) return;
  const apply = (p) => { S.p = p; if (S.scene) S.scene.applyScroll(p); else qs('#hero-canvas-wrap')?.style.setProperty('opacity', String(1 - smooth(0.6, 0.95, p))); };
  if (F.gsap && window.ScrollTrigger) {
    const proxy = { p: 0 };
    gsap.to(proxy, { p: 1, ease: 'none', scrollTrigger: { trigger: '#inicio', start: 'top top', end: 'bottom bottom', scrub: 0.35, onUpdate: () => apply(proxy.p) }, onUpdate: () => apply(proxy.p) });
  } else {
    let queued = false;
    const onScroll = () => {
      if (queued) return; queued = true;
      requestAnimationFrame(() => { queued = false; const range = Math.max(1, hero.offsetHeight - innerHeight); apply(clamp(scrollY / range, 0, 1)); });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }
}

/* ======================================================================
   6. Revelado del contenido del hero
   ====================================================================== */
async function revealContent() {
  const wm = qs('.hero-wordmark'), path = qs('.wordmark-hero .wm-path'), h1 = qs('.hero-title'), sub = qs('.hero-sub'), act = qs('.hero-actions');
  const corners = qsa('.hero-stage > .hero-corner');
  const all = [wm, h1, sub, act, ...corners].filter(Boolean);
  const animated = F.gsap && !F.reduced && window.gsap;
  if (!animated || !root.classList.contains('gsap')) { all.forEach((el) => el.classList.add('is-in')); return Promise.resolve(); }
  /* Espera a las fuentes (máx. 2,5 s) para que SplitText mida bien las líneas */
  if (document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 2500))]);
  const fontsOk = !document.fonts || document.fonts.status === 'loaded';
  const tl = gsap.timeline({ defaults: { ease: 'expo.out' } });
  const has3d = root.classList.contains('hero3d');
  if (wm) wm.classList.add('is-in');
  /* Sin escena 3D, el wordmark SVG se traza y se rellena; con escena, las partículas lo forman */
  if (path && wm && !has3d) {
    let L = 0; try { L = path.getTotalLength(); } catch (e) { L = 0; }
    const svgEl = path.ownerSVGElement;
    const scale = (svgEl && svgEl.getBoundingClientRect().width / 802) || 0.5;
    path.setAttribute('fill-opacity', '0');
    path.setAttribute('stroke-width', (1.1 / scale).toFixed(3));
    path.setAttribute('stroke-opacity', '1');
    if (L) { path.setAttribute('stroke-dasharray', String(L)); path.setAttribute('stroke-dashoffset', String(L)); }
    if (L) tl.to(path, { attr: { 'stroke-dashoffset': 0 }, duration: 1.44, ease: 'power2.inOut' }, 0);
    tl.to(path, { attr: { 'fill-opacity': 1 }, duration: 0.89, ease: 'power1.inOut' }, 0.75)
      .to(path, { attr: { 'stroke-opacity': 0 }, duration: 0.55, ease: 'power1.out' }, 1.3);
  }
  const t0 = has3d ? 0.9 : 0.7;
  const splitLines = (el) => {
    if (!window.SplitText || !fontsOk) return null; /* sin fuentes cargadas, SplitText mediría mal: se revela sin dividir */
    try { return typeof SplitText.create === 'function' ? SplitText.create(el, { type: 'lines', mask: 'lines', linesClass: 'hero-line' }) : new SplitText(el, { type: 'lines', mask: 'lines', linesClass: 'hero-line' }); } catch (e) { return null; }
  };
  if (h1) {
    h1.classList.add('is-in');
    const sp = splitLines(h1);
    if (sp && sp.lines.length) tl.from(sp.lines, { yPercent: 110, stagger: 0.055, duration: 0.89 }, t0);
  }
  if (sub) {
    sub.classList.add('is-in');
    const sp = splitLines(sub);
    if (sp && sp.lines.length) tl.from(sp.lines, { yPercent: 110, stagger: 0.055, duration: 0.89 }, t0 + 0.4);
  }
  if (act) {
    act.classList.add('is-in');
    tl.fromTo(act.children, { clipPath: 'inset(0 100% 0 0 round 999px)' }, { clipPath: 'inset(0 0% 0 0 round 999px)', duration: 0.89, stagger: 0.055 }, t0 + 0.65);
  }
  corners.forEach((c, i) => { c.classList.add('is-in'); tl.from(c, { opacity: 0, duration: 0.89 }, t0 + 0.85 + i * 0.055); });
  return new Promise((res) => tl.eventCallback('onComplete', res));
}

/* ======================================================================
   7. Arranque
   ====================================================================== */
(async function main() {
  const pre = runPreloader();

  /* La escena se construye en paralelo con el preloader */
  const scenePromise = (async () => {
    const THREE = await THREE_P;
    if (!THREE) { if (useGL) root.classList.add('no-webgl'); return null; }
    try { return await createScene(THREE); } catch (e) { console.error('[Aurea] hero3d:', e); root.classList.add('no-webgl'); return null; }
  })();
  scenePromise.then((sc) => {
    S.scene = sc; readyResolve(sc);
    if (!sc) return;
    wireLoop(); syncLoop();
    /* El canvas entra con fundido cuando la espiral se contrae (o ya, si no hubo preloader) */
    pre.contract.then(() => { S.entryOn = true; });
  });

  await Aurea.ready;
  wireScroll();
  qs('#hero-hint')?.remove(); /* sin gesto de mantener presionado: todo va con el scroll */

  /* Fin del preloader: emitir cuando los demás módulos ya escuchan */
  await pre.done;
  Aurea.emit('preloader:done');

  /* Las partículas forman el wordmark en cuanto la escena existe (si Three tarda, el texto se revela igual) */
  const formed = scenePromise.then((sc) => { if (sc) return formLogo(); });
  await Promise.race([formed, new Promise((r) => setTimeout(r, 600))]);
  await revealContent();
})();

</script>
