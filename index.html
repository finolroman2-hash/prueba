<style>
/* ---- tokens.css ---- */
/* ===== Tokens ===== */
:root {
  /* Color (del logo y la piel) */
  --grafito: #2A2626;
  --humo: #474040;
  --tinta: #231F1F;
  --perla: #EEE5DF;
  --nacar: #D9BBAC;
  --oro: #C8A472;
  --oro-claro: #E9D5B0;
  --logo-a: #4A4545; /* degradado del logo: arriba-izquierda */
  --logo-b: #252222; /* degradado del logo: abajo-derecha */

  /* Superficie actual (el JS interpola --bg al hacer scroll) */
  --bg: var(--grafito);
  --fg: var(--perla);
  --fg-2: rgba(238, 229, 223, 0.66);
  --fg-3: rgba(238, 229, 223, 0.6);
  --line: rgba(200, 164, 114, 0.35);
  --line-2: rgba(200, 164, 114, 0.18);
  --elev: var(--humo);
  --oro-texto: #86643A; /* oro legible como texto sobre perla y blanco (AA) */

  /* Tipografía: escala √φ ≈ 1,272 desde 17 px */
  --font-ui: 'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-num: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --fs--2: 0.6875rem;                                   /* 11 px */
  --fs--1: clamp(0.8125rem, 0.78rem + 0.15vw, 0.875rem); /* 13–14 px */
  --fs-0: clamp(1.0625rem, 1.02rem + 0.2vw, 1.125rem);   /* 17–18 px */
  --fs-1: clamp(1.25rem, 1.15rem + 0.45vw, 1.375rem);    /* 20–22 px */
  --fs-2: clamp(1.5rem, 1.3rem + 0.9vw, 1.75rem);        /* 24–28 px */
  --fs-3: clamp(1.75rem, 1.4rem + 1.6vw, 2.25rem);       /* 28–36 px */
  --fs-4: clamp(2.125rem, 1.6rem + 2.4vw, 2.875rem);     /* 34–46 px */
  --fs-5: clamp(2.5rem, 1.7rem + 3.6vw, 3.625rem);       /* 40–58 px */
  --fs-6: clamp(2.875rem, 1.8rem + 5vw, 4.625rem);       /* 46–74 px */
  --fs-7: clamp(3.25rem, 1.6rem + 7.5vw, 6rem);          /* 52–96 px */
  --lh-tight: 1.05;
  --lh-title: 1.12;
  --lh-body: 1.55;
  --track-title: -0.018em;
  --measure: 62ch;

  /* Espaciado Fibonacci */
  --s-1: 5px;
  --s-2: 8px;
  --s-3: 13px;
  --s-4: 21px;
  --s-5: 34px;
  --s-6: 55px;
  --s-7: 89px;
  --s-8: 144px;
  --gutter: clamp(var(--s-4), 4vw, var(--s-6));
  --section-y: clamp(var(--s-7), 12vh, var(--s-8));
  --max: 1440px;

  /* Forma */
  --radius: 2px;
  --pill: 999px;
  --stroke: 1.25px;

  /* Movimiento */
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-io: cubic-bezier(0.65, 0, 0.35, 1);
  --d-1: 0.34s;
  --d-2: 0.55s;
  --d-3: 0.89s;
  --d-4: 1.44s;
  --stagger: 0.055s;

  /* Proporción */
  --phi: 1.618;
  --ratio-v: 1 / 1.618;
  --ratio-h: 1.618 / 1;

  /* Capas */
  --z-canvas: 0;
  --z-content: 1;
  --z-header: 40;
  --z-dock: 50;
  --z-panel: 60;
  --z-lightbox: 70;
  --z-preloader: 80;
  --z-cursor: 90;

  color-scheme: dark;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

/* Zonas claras: el texto cambia por sección; el fondo lo interpola el JS */
[data-theme="light"] {
  --fg: var(--tinta);
  --fg-2: rgba(35, 31, 31, 0.68);
  --fg-3: rgba(35, 31, 31, 0.65);
  --line: rgba(200, 164, 114, 0.45);
  --line-2: rgba(200, 164, 114, 0.22);
  --elev: #FFFFFF;
  color-scheme: light;
}
[data-theme="dark"] {
  --fg: var(--perla);
  --fg-2: rgba(238, 229, 223, 0.66);
  --fg-3: rgba(238, 229, 223, 0.6);
  --line: rgba(200, 164, 114, 0.35);
  --line-2: rgba(200, 164, 114, 0.18);
  --elev: var(--humo);
  color-scheme: dark;
}


/* ---- base.css ---- */
/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: auto; }
html.reduced { scroll-behavior: auto; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-weight: 300;
  font-size: var(--fs-0);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: clip;
  min-height: 100vh;
}
html.lenis, html.lenis body { height: auto; }
.lenis.lenis-smooth { scroll-behavior: auto !important; }
.lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
.lenis.lenis-stopped { overflow: clip; }
.lenis.lenis-smooth iframe { pointer-events: none; }
img, svg, video { display: block; max-width: 100%; }
img { height: auto; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
ul, ol { margin: 0; padding: 0; list-style: none; }
p, h1, h2, h3, h4, figure, dl, dd { margin: 0; }
h1, h2, h3, h4 { font-weight: 200; line-height: var(--lh-title); letter-spacing: var(--track-title); text-wrap: balance; }
::selection { background: rgba(200, 164, 114, 0.35); color: inherit; }

/* Foco visible en oro (solo con teclado) */
:focus { outline: none; }
:focus-visible { outline: 1.5px solid var(--oro); outline-offset: 3px; border-radius: 2px; }
.skip { position: fixed; top: var(--s-2); left: var(--s-2); z-index: 100; padding: var(--s-2) var(--s-4); background: var(--grafito); color: var(--oro-claro); border: 1px solid var(--line); border-radius: var(--pill); transform: translateY(-200%); transition: transform var(--d-1) var(--ease); }
.skip:focus-visible { transform: none; }
.skip-2 { left: auto; right: var(--s-2); }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* ===== Tipografía ===== */
.num { font-family: var(--font-num); font-style: italic; font-weight: 400; font-variation-settings: 'opsz' 48; letter-spacing: 0; }
.title-1 { font-size: var(--fs-6); font-weight: 200; }
.title-2 { font-size: var(--fs-5); font-weight: 200; }
.title-3 { font-size: var(--fs-4); font-weight: 200; }
.title-4 { font-size: var(--fs-2); font-weight: 300; letter-spacing: -0.01em; display: flex; align-items: center; gap: var(--s-3); }
.title-4 .ic { color: var(--oro); flex: none; }
.overline { font-size: var(--fs--1); font-weight: 400; color: var(--fg-2); display: flex; align-items: center; gap: var(--s-2); margin-bottom: var(--s-3); }
.overline .ic { color: var(--oro); }
.overline::before { content: ''; width: 21px; height: 1px; background: var(--oro); opacity: 0.7; }
.lead-xl { font-size: var(--fs-3); font-weight: 200; line-height: 1.3; letter-spacing: -0.012em; max-width: 26ch; text-wrap: pretty; }
.prose { max-width: var(--measure); }
.prose p + p { margin-top: var(--s-4); }
.section-intro { color: var(--fg-2); max-width: 48ch; margin-top: var(--s-3); text-wrap: pretty; }
.hint { font-size: var(--fs--1); color: var(--fg-2); }

/* Líneas de texto reveladas por máscara (SplitText); sin JS todo es visible */
.line-mask { display: block; overflow: hidden; }
html.gsap [data-reveal="lines"]:not(.is-split) { visibility: hidden; }

/* ===== Botones (píldora, borde fino) ===== */
.btn {
  --btn-bg: transparent; --btn-fg: var(--fg); --btn-line: var(--line);
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  min-height: 44px; padding: 0 var(--s-4); border-radius: var(--pill);
  border: 1px solid var(--btn-line); background: var(--btn-bg); color: var(--btn-fg);
  font-size: var(--fs--1); font-weight: 400; letter-spacing: 0.01em; line-height: 1; white-space: nowrap;
  transition: color var(--d-1) var(--ease), background-color var(--d-1) var(--ease), border-color var(--d-1) var(--ease), transform var(--d-2) var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.btn .ic { flex: none; opacity: 0.9; }
.btn-primary { --btn-bg: var(--oro); --btn-fg: var(--tinta); --btn-line: var(--oro); }
.btn-primary:hover { --btn-bg: var(--oro-claro); --btn-line: var(--oro-claro); }
.btn-secondary { --btn-bg: transparent; --btn-fg: var(--fg); --btn-line: var(--line); }
.btn-secondary:hover { --btn-line: var(--oro); }
[data-theme="light"] .btn-secondary:hover { --btn-bg: rgba(200, 164, 114, 0.08); }
.btn-ghost { --btn-line: transparent; --btn-fg: var(--fg-2); padding-inline: var(--s-3); }
.btn-ghost:hover { --btn-fg: var(--fg); }
.btn-lg { min-height: 50px; padding: 0 var(--s-5); font-size: var(--fs-0); font-weight: 300; }
.btn-sm { min-height: 36px; padding: 0 var(--s-3); font-size: var(--fs--2); font-size: 0.78rem; }
.btn-wa .ic { color: inherit; }
.btn-block { width: 100%; }

/* Enlaces de texto con subrayado fino */
.link { border-bottom: 1px solid var(--line); transition: border-color var(--d-1) var(--ease); }
.link:hover { border-color: var(--oro); }

/* ===== Figuras áureas + placeholder de marca ===== */
.fig { position: relative; overflow: hidden; border-radius: var(--radius); background: var(--grafito); margin: 0; }
.fig-v { aspect-ratio: 1 / 1.618; }
.fig-h { aspect-ratio: 1.618 / 1; }
.fig-sq { aspect-ratio: 1 / 1; }
.fig > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity var(--d-3) var(--ease); }
.fig.is-loaded > img { opacity: 1; }
.ph { position: absolute; inset: 0; background: linear-gradient(135deg, var(--logo-a) 0%, var(--grafito) 55%, var(--logo-b) 100%); display: grid; place-items: center; overflow: hidden; }
.ph .ph-spiral { position: absolute; width: 86%; height: 86%; inset: auto; right: -12%; bottom: -14%; color: var(--oro); opacity: 0.25; }
.ph-1 .ph-spiral { right: auto; left: -12%; transform: scaleX(-1); }
.ph-2 .ph-spiral { bottom: auto; top: -14%; transform: scaleY(-1); }
.ph-3 .ph-spiral { right: auto; left: -12%; bottom: auto; top: -14%; transform: scale(-1); }
.ph .ph-initial { position: relative; font-size: clamp(3rem, 22cqw, 8rem); color: var(--oro-claro); opacity: 0.8; line-height: 1; }
.fig { container-type: inline-size; }

/* Revelado de imágenes con clip-path desde el rectángulo áureo (JS quita el clip) */
html.gsap .fig-reveal { clip-path: inset(0 100% 0 0 round var(--radius)); }
html.gsap .fig-reveal.is-revealed { clip-path: inset(0 0 0 0 round var(--radius)); }
html.reduced .fig-reveal { clip-path: none !important; }

/* Cada zona aplica su color de texto; el fondo lo interpola el módulo de movimiento (html.theme-scroll) y, sin él, lo pinta el CSS */
[data-theme] { color: var(--fg); }
html:not(.theme-scroll) [data-theme="light"] { background: var(--perla); }
html:not(.theme-scroll) .footer, html:not(.theme-scroll) .servicios, html:not(.theme-scroll) .que-es { background: var(--grafito); }

/* ===== Estructura ===== */
.wrap { width: min(100% - 2 * var(--gutter), var(--max)); margin-inline: auto; }
.section { position: relative; padding-block: var(--section-y); }
.grid-phi { display: grid; grid-template-columns: minmax(0, 38.2fr) minmax(0, 61.8fr); gap: var(--s-6) var(--s-7); align-items: start; }
.grid-phi > .col-a { min-width: 0; }
.grid-phi > .col-b { min-width: 0; }
.section-head { margin-bottom: var(--s-6); }
.section-head .title-2 { max-width: 14ch; }
hr.rule { border: 0; height: 1px; background: var(--line); margin: 0; }
@media (max-width: 900px) {
  .grid-phi { grid-template-columns: 1fr; gap: var(--s-5); }
}

/* ===== Header fijo mínimo ===== */
.header {
  position: fixed; inset: 0 0 auto 0; z-index: var(--z-header);
  display: flex; align-items: center; justify-content: space-between;
  height: var(--s-6); padding-inline: var(--gutter);
  transform: translateY(0); transition: transform var(--d-2) var(--ease), opacity var(--d-2) var(--ease);
}
.header.is-hidden { transform: translateY(-110%); visibility: hidden; transition: transform var(--d-2) var(--ease), opacity var(--d-2) var(--ease), visibility 0s linear var(--d-2); }
.header::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(42, 38, 38, 0.55), rgba(42, 38, 38, 0)); opacity: 0; transition: opacity var(--d-2) var(--ease); pointer-events: none; }
.header.is-scrolled::before { opacity: 1; }
.header-brand { display: block; height: 14px; color: var(--perla); transition: color var(--d-2) var(--ease); }
.header-brand .wordmark { height: 100%; width: auto; }
.wordmark { display: block; fill: currentColor; }
.wordmark-sm { height: 14px; width: auto; }
.header-cta { --btn-bg: rgba(42, 38, 38, 0.35); --btn-fg: var(--oro-claro); --btn-line: var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.header-cta:hover { --btn-bg: var(--oro); --btn-fg: var(--tinta); --btn-line: var(--oro); }
body.on-light .header-brand { color: var(--tinta); }
body.on-light .header-cta { --btn-bg: rgba(238, 229, 223, 0.5); --btn-fg: var(--tinta); }
body.on-light .header::before { background: linear-gradient(to bottom, rgba(238, 229, 223, 0.55), rgba(238, 229, 223, 0)); }

/* ===== Preloader (base; la coreografía la anima el JS) ===== */
.preloader {
  position: fixed; inset: 0; z-index: var(--z-preloader);
  background: linear-gradient(135deg, var(--logo-a) 0%, #332E2E 45%, var(--logo-b) 100%);
  display: grid; place-items: center; color: var(--oro);
  animation: preloader-safety 0s linear 4.5s forwards; /* red de seguridad si el JS no llega */
}
html.no-preloader .preloader { display: none; animation: none; }
@keyframes preloader-safety { to { opacity: 0; visibility: hidden; pointer-events: none; } }

/* ===== Hero: composición centrada; el wordmark (caja .hero-wordmark) lo forman las partículas 3D ===== */
.hero-canvas-wrap { position: fixed; inset: 0; z-index: var(--z-canvas); pointer-events: none; }
.hero-canvas-wrap canvas { display: block; width: 100%; height: 100%; }
.hero { position: relative; z-index: var(--z-content); height: 170svh; padding: 0; }
.hero-stage {
  --pearl-x: 0.5; --pearl-y: 0.42;
  position: sticky; top: 0; height: 100svh; overflow: hidden;
  display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  padding: calc(var(--s-6) + var(--s-4)) var(--gutter) calc(var(--s-7) + var(--safe-b));
}
.hero-bg { position: absolute; inset: 0; z-index: -1; background: radial-gradient(120% 90% at 20% 10%, var(--logo-a) 0%, #332E2E 45%, var(--logo-b) 100%); }
.hero-fallback { position: absolute; inset: 0; z-index: 0; display: none; pointer-events: none; }
.hero-fallback-spiral { position: absolute; width: 130vmin; height: 130vmin; left: calc(var(--pearl-x) * 100% - 65vmin); top: calc(var(--pearl-y) * 100% - 65vmin); color: var(--oro); opacity: 0.22; }
.hero-fallback-glow { position: absolute; width: 70vmin; height: 40vmin; left: calc(var(--pearl-x) * 100% - 35vmin); top: calc(var(--pearl-y) * 100% - 20vmin); border-radius: 50%; background: radial-gradient(ellipse, rgba(233, 213, 176, 0.32) 0%, rgba(233, 213, 176, 0.1) 40%, rgba(233, 213, 176, 0) 70%); filter: blur(12px); }
html.no-webgl .hero-fallback, html.reduced .hero-fallback { display: block; }
html.no-webgl .hero-canvas-wrap, html.reduced .hero-canvas-wrap { display: none; }
.hero-content { position: relative; z-index: 2; width: 100%; max-width: 1040px; display: flex; flex-direction: column; align-items: center; }
.hero-wordmark { width: min(80vw, 980px); color: var(--perla); margin-bottom: clamp(var(--s-5), 6vh, var(--s-7)); }
.wordmark-hero { width: 100%; height: auto; }
.hero-title { font-size: var(--fs-6); font-weight: 200; line-height: var(--lh-tight); letter-spacing: -0.025em; color: var(--perla); max-width: 18ch; }
.hero-sub { margin-top: var(--s-4); font-size: var(--fs-1); font-weight: 300; color: var(--fg-2); max-width: 44ch; text-wrap: pretty; }
.hero-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--s-3); margin-top: var(--s-5); }
.hero-corner { position: absolute; z-index: 2; bottom: calc(var(--s-5) + var(--safe-b)); color: var(--fg-2); font-size: var(--fs--1); }
.hero-phi { left: var(--gutter); font-size: var(--fs-0); color: var(--oro); }
.hero-scroll { right: var(--gutter); display: flex; flex-direction: column; align-items: center; gap: var(--s-2); }
.scroll-line { display: block; width: 1px; height: 34px; background: linear-gradient(to bottom, var(--oro), transparent); transform-origin: top; animation: scroll-line 1.44s var(--ease-io) infinite; }
@keyframes scroll-line { 0% { transform: scaleY(0); transform-origin: top; } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }
.hero-hint { display: none; }
@media (max-width: 900px) {
  .hero { height: 150svh; }
  .hero-stage { padding-bottom: calc(var(--s-7) + var(--s-5) + var(--safe-b)); }
  .hero-wordmark { width: min(86vw, 640px); }
  .hero-title { max-width: 14ch; }
  .hero-corner { bottom: calc(var(--s-7) + var(--safe-b) - 8px); }
}
@media (max-width: 520px) {
  .hero-stage { --pearl-y: 0.4; padding-bottom: calc(var(--s-7) + var(--safe-b)); }
  .hero-wordmark { width: 88vw; margin-bottom: var(--s-5); }
  .hero-title { font-size: var(--fs-5); }
  .hero-sub { margin-top: var(--s-3); }
  .hero-actions { margin-top: var(--s-4); width: 100%; }
  .hero-actions .btn { flex: 1 1 100%; }
  .hero-scroll { display: none; }
  .hero-corner { bottom: calc(var(--s-6) + var(--safe-b)); }
}

/* ===== ¿Qué es? ===== */
.que-es .lead-xl .w { display: inline-block; opacity: 0.2; transition: opacity 0.2s linear; will-change: opacity; }
.que-es .lead-xl .w.is-on { opacity: 1; }
html:not(.gsap) .que-es .lead-xl .w, html.reduced .que-es .lead-xl .w { opacity: 1; }
.que-es .btn { margin-top: var(--s-5); }
.que-es .title-2 { position: sticky; top: calc(var(--s-6) + var(--s-5)); }

/* ===== Fundadora ===== */
.fundadora .col-a { max-width: 420px; }
.fundadora .col-a .fig { position: sticky; top: calc(var(--s-6) + var(--s-5)); }
.cifras { display: flex; flex-wrap: wrap; gap: var(--s-5) var(--s-7); margin-top: var(--s-6); padding-top: var(--s-5); border-top: 1px solid var(--line); }
.cifra-valor { font-size: var(--fs-6); color: var(--oro); line-height: 1; font-variation-settings: 'opsz' 96; }
[data-theme="light"] .cifra-valor { color: var(--oro-texto); }
.cifra-etiqueta { margin-top: var(--s-2); color: var(--fg-2); }
.cifra-prefijo { font-family: var(--font-ui); font-style: normal; font-weight: 300; font-size: 0.5em; vertical-align: 0.5em; margin-right: 0.06em; }

@media (max-width: 900px) {
  .fundadora .col-a { max-width: 300px; }
  .fundadora .col-a .fig { position: relative; top: auto; }
}

/* ===== Marquesina ===== */
.marquee { position: relative; overflow: hidden; padding-block: var(--s-5); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.marquee-track { display: flex; width: max-content; will-change: transform; }
.marquee-group { display: flex; align-items: baseline; gap: var(--s-5); padding-right: var(--s-5); }
.marquee-item { font-size: var(--fs-4); color: var(--fg); white-space: nowrap; font-variation-settings: 'opsz' 72; }
.marquee-sep { font-family: var(--font-num); font-style: italic; color: var(--oro); font-size: var(--fs-1); }
html:not(.gsap) .marquee-track { animation: marquee 34s linear infinite; }
html.reduced .marquee-track { animation: none; transform: none; }
@keyframes marquee { to { transform: translateX(-50%); } }

/* ===== Servicios: grid en particiones áureas ===== */
.servicios { z-index: var(--z-content); }
.cat-grid { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); grid-auto-rows: minmax(233px, auto); gap: var(--s-3); }
.cat {
  position: relative; grid-column: span 13; min-height: 233px; display: flex; flex-direction: column; justify-content: flex-end;
  text-align: left; padding: var(--s-4); border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden;
  background: linear-gradient(160deg, rgba(71, 64, 64, 0.55), rgba(42, 38, 38, 0.2));
  transition: border-color var(--d-2) var(--ease), transform var(--d-3) var(--ease);
  isolation: isolate;
}
.cat:hover, .cat:focus-visible { border-color: var(--line); }
.cat-cover { position: absolute; inset: 0; z-index: 0; opacity: 0; transform: scale(1.04); transition: opacity var(--d-3) var(--ease), transform var(--d-4) var(--ease); pointer-events: none; }
.cat-cover .fig { position: absolute; inset: 0; aspect-ratio: auto; height: 100%; border-radius: 0; }
.cat-cover::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(42, 38, 38, 0.92) 0%, rgba(42, 38, 38, 0.45) 45%, rgba(42, 38, 38, 0.1) 100%); }
.cat:hover .cat-cover, .cat:focus-visible .cat-cover, .cat.is-touched .cat-cover { opacity: 1; transform: scale(1); }
.cat-icon { position: absolute; top: var(--s-4); left: var(--s-4); z-index: 1; color: var(--oro); }
.cat-icon .ic path, .cat-icon .ic circle, .cat-icon .ic rect { stroke-dasharray: 60; stroke-dashoffset: 0; transition: stroke-dashoffset var(--d-3) var(--ease); }
.cat:hover .cat-icon .ic path, .cat:hover .cat-icon .ic circle, .cat:hover .cat-icon .ic rect { animation: redraw var(--d-4) var(--ease) forwards; }
@keyframes redraw { 0% { stroke-dashoffset: 60; } 100% { stroke-dashoffset: 0; } }
.cat-body { position: relative; z-index: 1; display: flex; flex-direction: column; gap: var(--s-2); }
.cat-name { font-size: var(--fs-3); font-weight: 200; letter-spacing: -0.015em; line-height: 1.1; }
.cat-frase { color: var(--fg-2); font-size: var(--fs--1); max-width: 34ch; text-wrap: pretty; }
.cat-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s-2) var(--s-4); margin-top: var(--s-2); font-size: var(--fs--1); color: var(--fg-2); }
.cat-from { color: var(--fg-2); }
.cat-from .num { font-size: var(--fs-1); color: var(--oro); }
.cat-faciales { grid-column: span 8; grid-row: span 2; min-height: 377px; }
.cat-faciales .cat-name { font-size: var(--fs-4); }
.cat-corporales { grid-column: span 5; grid-row: span 2; min-height: 377px; }
.cat-depilacion-laser { grid-column: span 4; }
.cat-bronceado { grid-column: span 3; }
.cat-despigmentacion { grid-column: span 3; }
.cat-hifu-25d-360 { grid-column: span 3; }
.cat-depilacion-laser .cat-name, .cat-bronceado .cat-name, .cat-despigmentacion .cat-name, .cat-hifu-25d-360 .cat-name { font-size: var(--fs-2); }
.cat-despigmentacion .cat-frase, .cat-hifu-25d-360 .cat-frase, .cat-bronceado .cat-frase { display: none; }
@media (max-width: 1100px) and (min-width: 701px) {
  .cat-grid { grid-template-columns: repeat(8, minmax(0, 1fr)); }
  .cat-faciales { grid-column: span 8; grid-row: span 1; min-height: 320px; }
  .cat-corporales { grid-column: span 5; grid-row: span 1; min-height: 260px; }
  .cat-depilacion-laser { grid-column: span 3; }
  .cat-bronceado { grid-column: span 3; }
  .cat-despigmentacion { grid-column: span 2; }
  .cat-hifu-25d-360 { grid-column: span 3; }
  .cat-frase { display: block !important; }
  .cat-despigmentacion .cat-frase { display: none !important; }
}
@media (max-width: 700px) {
  .cat-grid { grid-template-columns: 1fr; grid-auto-rows: auto; }
  .cat, .cat-faciales, .cat-corporales { grid-column: span 1; grid-row: span 1; min-height: 0; aspect-ratio: 1.618 / 1; }
  .cat-faciales { aspect-ratio: 1.2 / 1; }
  .cat-frase { display: block !important; }
  .cat-cover { opacity: 0.45; transform: none; }
  .cat-cover .ph-initial { display: none; }
}

/* ===== Unidades médicas (apilado sticky en escritorio) ===== */
.stack { display: grid; gap: var(--s-5); }
.unit { position: relative; background: var(--elev); border: 1px solid var(--line); border-radius: 4px; padding: clamp(var(--s-4), 4vw, var(--s-6)); transform-origin: top center; --fg: var(--tinta); --fg-2: rgba(35, 31, 31, 0.68); --fg-3: rgba(35, 31, 31, 0.65); color: var(--fg); }
.unit-photos { display: grid; gap: var(--s-3); }
.unit-photos.n2 { grid-template-columns: 1fr 1fr; }
.unit-photo { margin: 0; }
.unit-photo-name { margin-top: var(--s-2); font-size: var(--fs--1); color: var(--fg-2); }
.unit-ig { display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-3); margin-top: var(--s-4); }
.ig-link { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs--1); color: var(--fg-2); border-bottom: 1px solid transparent; transition: color var(--d-1) var(--ease), border-color var(--d-1) var(--ease); }
.ig-link .ic { color: var(--oro); }
.ig-link:hover { color: var(--fg); border-color: var(--oro); }
.unit-doc { display: flex; align-items: center; gap: var(--s-2); margin: var(--s-3) 0 var(--s-4); font-size: var(--fs-0); font-weight: 400; color: var(--oro-texto); }
.unit-doc .ic { flex: none; }
.proc-list { display: grid; gap: var(--s-4); margin-top: var(--s-5); padding-top: var(--s-4); border-top: 1px solid var(--line-2); }
.proc-group-name { display: block; font-size: var(--fs--1); color: var(--fg-2); margin-bottom: var(--s-2); }
.proc-items { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.proc-item { padding: 6px 13px; border: 1px solid var(--line); border-radius: var(--pill); font-size: var(--fs--1); }
.estudios { display: grid; gap: var(--s-3); margin-top: var(--s-4); }
.estudio { padding: var(--s-3) 0 var(--s-3) var(--s-4); border-left: 1px solid var(--oro); }
.estudio dt { font-weight: 400; }
.estudio dd { color: var(--fg-2); margin-top: 3px; font-size: var(--fs--1); }
.estudios + .prose { margin-top: var(--s-4); }
.unit-actions { margin-top: var(--s-5); }
@media (min-width: 901px) {
  .stack { gap: var(--s-4); }
  .unit { position: sticky; top: calc(var(--s-6) + var(--i) * 13px); }
  .unit .col-a { position: sticky; top: calc(var(--s-6) + var(--s-5)); }
  .unit .col-a { max-width: 360px; }
}
@media (max-width: 900px) {
  .unit .unit-photos { max-width: 320px; }
  .unit-photos.n2 { max-width: 100%; }
}
@media (min-width: 701px) and (max-width: 900px) {
  .unit .unit-inner { grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: var(--s-5); align-items: start; }
  .unit .unit-photos { max-width: 280px; }
}

/* ===== Información ===== */
.info-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1.5fr); gap: var(--s-6); align-items: start; }
.info-block { display: flex; flex-direction: column; gap: var(--s-4); }
.info-text { max-width: 36ch; text-wrap: pretty; }
.info-text-2 { color: var(--fg-2); margin-top: calc(-1 * var(--s-3)); }
.info-map { position: relative; aspect-ratio: 1.618 / 1; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: var(--grafito); }
.info-map-poster { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: var(--s-2); color: var(--oro-claro); background: linear-gradient(135deg, var(--logo-a), var(--logo-b)); text-align: center; padding: var(--s-4); }
.info-map-name { font-size: var(--fs-1); font-weight: 300; color: var(--perla); }
.info-map-addr { font-size: var(--fs--1); color: rgba(238, 229, 223, 0.66); }
.info-map iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; filter: grayscale(1) contrast(1.05) sepia(0.15); opacity: 0; transition: opacity var(--d-3) var(--ease); }
.info-map.has-iframe iframe { opacity: 1; }
.info-phone { font-size: var(--fs-3); white-space: nowrap; color: var(--oro-texto); line-height: 1; align-self: flex-start; border-bottom: 1px solid transparent; transition: border-color var(--d-1) var(--ease); }
.info-phone:hover { border-color: var(--oro); }
.social { display: grid; gap: var(--s-3); }
.social-link { display: inline-flex; align-items: center; gap: var(--s-3); color: var(--fg-2); transition: color var(--d-1) var(--ease); }
.social-link .ic { color: var(--oro); }
.social-link b { font-weight: 400; color: var(--fg); }
.social-link:hover { color: var(--fg); }
.info-contacto .btn { align-self: flex-start; }
.info-regalo .btn { align-self: flex-start; }
@media (max-width: 1000px) {
  .info-grid { grid-template-columns: 1fr 1fr; }
  .info-regalo { grid-column: span 2; max-width: 640px; }
}
@media (max-width: 640px) {
  .info-grid { grid-template-columns: 1fr; }
  .info-regalo { grid-column: span 1; }
}

/* Tarjeta de regalo: objeto físico (rectángulo áureo), el JS la inclina y mueve el reflejo */
.gift { perspective: 1200px; max-width: 480px; }
.gift-card {
  --rx: 0deg; --ry: 0deg; --mx: 50%; --my: 50%;
  position: relative; aspect-ratio: 1.618 / 1; border-radius: 12px; overflow: hidden;
  transform: rotateX(var(--rx)) rotateY(var(--ry)); transform-style: preserve-3d;
  transition: transform var(--d-2) var(--ease);
  box-shadow: 0 34px 55px -34px rgba(35, 31, 31, 0.55), 0 1px 0 rgba(233, 213, 176, 0.35) inset;
  background: linear-gradient(135deg, var(--logo-a) 0%, #332E2E 45%, var(--logo-b) 100%);
  color: var(--perla);
}
.gift-texture { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity var(--d-3) var(--ease); }
.gift-card.has-texture .gift-texture { opacity: 1; }
.gift-face { position: absolute; inset: 0; padding: 8% 7%; display: flex; flex-direction: column; justify-content: space-between; }
.wordmark-gift { width: 38%; height: auto; color: var(--perla); }
.gift-title { font-size: var(--fs-1); font-weight: 200; letter-spacing: -0.01em; margin-top: auto; }
.gift-line { display: block; width: 34px; height: 1px; background: var(--oro); margin: 6px 0 8px; }
.gift-note { font-size: var(--fs--1); color: var(--oro-claro); }
.gift-phi { position: absolute; right: 7%; bottom: 8%; font-size: var(--fs-3); color: var(--oro); opacity: 0.7; }
.gift-holo { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: 0.55;
  background: linear-gradient(115deg, transparent 20%, rgba(233, 213, 176, 0.35) 40%, rgba(217, 187, 172, 0.35) 50%, rgba(200, 164, 114, 0.35) 60%, transparent 80%);
  background-size: 250% 250%; background-position: calc(var(--mx)) calc(var(--my)); }
.gift-shine { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at var(--mx) var(--my), rgba(255, 255, 255, 0.16), transparent 45%); }

/* ===== Footer ===== */
.footer { position: relative; padding: var(--section-y) 0 calc(var(--s-7) + var(--safe-b)); border-top: 1px solid var(--line-2); }
.footer-links { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-3); }
.footer-link { display: flex; flex-direction: column; gap: var(--s-3); padding: var(--s-5) var(--s-4); border: 1px solid var(--line-2); border-radius: 4px; transition: border-color var(--d-2) var(--ease), background-color var(--d-2) var(--ease); }
.footer-link:hover { border-color: var(--line); background: rgba(71, 64, 64, 0.35); }
.footer-link-icon { color: var(--oro); }
.footer-link-name { font-size: var(--fs-2); font-weight: 200; }
.footer-link-user { color: var(--fg-2); font-size: var(--fs--1); }
.footer-wordmark { margin: var(--s-7) 0 var(--s-5); color: var(--oro); }
.wordmark-giant { width: 100%; height: auto; fill: transparent; stroke: var(--oro); stroke-width: 0.9; transition: fill var(--d-3) var(--ease); }
.footer-wordmark:hover .wordmark-giant { fill: var(--oro); }
html.touch .wordmark-giant { fill: rgba(200, 164, 114, 0.12); }
.footer-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--s-3) var(--s-5); color: var(--fg-2); font-size: var(--fs--1); padding-top: var(--s-4); border-top: 1px solid var(--line-2); }
.footer-note { width: 100%; color: var(--fg-2); }
@media (max-width: 700px) {
  .footer-links { grid-template-columns: 1fr; }
  .footer-link { flex-direction: row; align-items: center; gap: var(--s-4); padding: var(--s-4); }
  .footer-link-user { margin-left: auto; }
  .footer { padding-bottom: calc(var(--s-7) + var(--s-5) + var(--safe-b)); }
}

/* ===== Movimiento reducido ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; transition-duration: 0.001s !important; scroll-behavior: auto !important; }
  .scroll-line, .hero-hint::before { animation: none !important; }
}


/* ---- nav.css ---- */
/* ===== Navegación: dock, menú de servicios, progreso, cursor ===== */

/* Sin Lenis, el panel bloquea el scroll con esta clase (con Lenis ya lo hace html.lenis-stopped) */
html.nav-stopped { overflow: hidden; }

/* ----- Dock ----- */
.dock {
  position: fixed; z-index: var(--z-dock);
  left: 50%; bottom: calc(var(--s-4) + var(--safe-b));
  transform: translate(-50%, 0);
  opacity: 0; visibility: hidden;
  transition: transform var(--d-3) var(--ease), opacity var(--d-2) var(--ease), visibility 0s linear var(--d-2);
  will-change: transform, opacity;
  color: var(--perla);
  -webkit-user-select: none; user-select: none;
}
.dock:not(.is-in) { transform: translate(-50%, 34px); }
.dock.is-in { opacity: 1; visibility: visible; transition: transform var(--d-3) var(--ease), opacity var(--d-2) var(--ease), visibility 0s; }
.dock.is-away { opacity: 0; visibility: hidden; transform: translate(-50%, 34px); pointer-events: none; }

.dock-list {
  display: flex; align-items: flex-end; gap: var(--s-2);
  padding: var(--s-2) var(--s-3);
  margin: 0;
  border-radius: var(--pill);
  background: rgba(42, 38, 38, 0.55);
  border: 1px solid var(--line-2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
  box-shadow: 0 1px 0 rgba(233, 213, 176, 0.08) inset, 0 21px 55px -21px rgba(35, 31, 31, 0.6);
}
/* Sobre zonas perla el vidrio se densifica para seguir leyéndose como objeto grafito */
.dock.is-on-light .dock-list { background: rgba(42, 38, 38, 0.8); border-color: rgba(200, 164, 114, 0.3); box-shadow: 0 1px 0 rgba(233, 213, 176, 0.1) inset, 0 21px 55px -21px rgba(35, 31, 31, 0.45); }
.dock-menu.is-on-light .dock-menu-box { background: rgba(42, 38, 38, 0.9); }
.dock-item { position: relative; display: flex; flex-direction: column; align-items: center; will-change: transform; }
.dock-btn {
  position: relative; display: grid; place-items: center;
  width: 44px; height: 44px; border-radius: 50%;
  color: rgba(238, 229, 223, 0.72);
  transform-origin: 50% 100%;
  transition: color var(--d-1) var(--ease), background-color var(--d-1) var(--ease);
  -webkit-tap-highlight-color: transparent;
  will-change: transform;
}
.dock-btn .ic { width: 22px; height: 22px; }
.dock-btn:hover, .dock-btn:focus-visible { color: var(--perla); background: rgba(238, 229, 223, 0.06); }
.dock-btn:focus-visible { outline-offset: -2px; }
.dock-btn.is-active { color: var(--oro-claro); }
/* Punto activo: debajo del ícono */
.dock-btn::after {
  content: ''; position: absolute; left: 50%; bottom: 3px; width: 3px; height: 3px; border-radius: 50%;
  background: var(--oro); transform: translate(-50%, 4px) scale(0); opacity: 0;
  transition: transform var(--d-2) var(--ease), opacity var(--d-2) var(--ease);
}

/* WhatsApp en oro */

.dock-wa::before { content: ''; position: absolute; inset: 5px; border-radius: 50%; border: 1px solid var(--line-2); transition: border-color var(--d-1) var(--ease), inset var(--d-1) var(--ease); }

}
.dock-tip::after { content: ''; position: absolute; left: 50%; top: 100%; width: 1px; height: 8px; background: linear-gradient(to bottom, var(--line), transparent); transform: translateX(-50%); }
.dock-item:hover .dock-tip, .dock-item:focus-within .dock-tip { opacity: 1; transform: translate(-50%, 0) scale(1); }

.dock-tip-s { display: none; }

/* ----- Menú de servicios ----- */
.dock-menu {
  position: fixed; z-index: var(--z-dock);
  left: 50%; bottom: calc(var(--s-4) + var(--safe-b) + 60px + var(--s-3));
  width: min(360px, calc(100vw - 2 * var(--gutter)));

.dock-menu-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); padding: var(--s-4) var(--s-4) var(--s-2); }
.dock-menu-title { font-size: var(--fs-1); font-weight: 200; letter-spacing: var(--track-title); }

.dock-menu-all:hover, .dock-menu-all:focus-visible { color: var(--oro-claro); border-color: var(--oro); }
.dock-menu-list { display: flex; flex-direction: column; padding: 0 var(--s-2) var(--s-2); }
.dock-menu-item {
  display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: var(--s-3);
  width: 100%; padding: 10px var(--s-3); border-radius: 8px;

}
.dock-menu.is-open .dock-menu-item { opacity: 1; transform: none; transition: opacity var(--d-2) var(--ease), transform var(--d-2) var(--ease), background-color var(--d-1) var(--ease); transition-delay: calc(var(--i) * var(--stagger)), calc(var(--i) * var(--stagger)), 0s; }
.dock-menu-item:hover, .dock-menu-item:focus-visible, .dock-menu-item.is-focus { background: rgba(238, 229, 223, 0.06); }
.dock-menu-item:focus-visible { outline-offset: -2px; }
.dock-menu-icon { display: grid; place-items: center; width: 28px; height: 28px; color: var(--oro); }
.dock-menu-icon .ic { width: 22px; height: 22px; }
.dock-menu-name { font-size: var(--fs-0); font-weight: 300; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock-menu-from { font-size: 0.78rem; color: var(--fg-2); white-space: nowrap; }
.dock-menu-from .num { font-size: var(--fs-0); color: var(--oro); margin-left: 3px; }
.dock-menu-item:hover .dock-menu-name { color: var(--oro-claro); }
.dock-menu-item .dock-menu-icon .ic path, .dock-menu-item .dock-menu-icon .ic circle { stroke-dasharray: 60; }
.dock-menu-item:hover .dock-menu-icon .ic path, .dock-menu-item:hover .dock-menu-icon .ic circle { animation: redraw var(--d-4) var(--ease) forwards; }

/* ----- Móvil: barra inferior a todo el ancho ----- */
@media (max-width: 767px) {
  .dock { left: 0; right: 0; bottom: 0; transform: none; width: 100%; }

    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); align-items: stretch; gap: 0;
    padding: 6px var(--s-2) calc(6px + var(--safe-b));

  }
  .dock-item { display: flex; flex-direction: column; align-items: center; will-change: auto; }

  .dock-item.dock-item-wa::before { display: none; }

  .dock-btn .ic { width: 21px; height: 21px; }

  .dock-btn::after { bottom: auto; top: -4px; width: 13px; height: 1px; border-radius: 0; transform: translate(-50%, 0) scaleX(0); }
  .dock-btn.is-active::after, .dock-btn[aria-expanded="true"]::after { transform: translate(-50%, 0) scaleX(1); }
  .dock-wa::before { display: none; }
  /* Etiqueta corta debajo del ícono, siempre visible */

  .dock-tip-s { display: inline; }
  .dock-item:has(.is-active) .dock-tip { color: var(--oro-claro); }
  .dock-item-wa .dock-tip { color: var(--oro-claro); }

  .dock-menu { left: var(--s-3); right: var(--s-3); width: auto; transform: none; bottom: calc(var(--safe-b) + 68px + var(--s-3)); }

/* ----- Indicador de progreso (espiral áurea) ----- */
.progress {
  position: fixed; z-index: var(--z-dock);
  left: var(--gutter); bottom: calc(var(--s-4) + var(--safe-b));
  width: 44px; height: 44px;
  color: var(--oro);
  opacity: 0; transform: translateY(8px);

  pointer-events: none;
}
.progress.is-on { opacity: 1; transform: none; }

  .progress { left: auto; right: var(--gutter); top: calc(var(--s-6) + var(--s-2)); bottom: auto; width: 30px; height: 30px; transform: translateY(-6px); }

/* ----- Cursor personalizado (solo puntero fino) ----- */
.cursor { position: fixed; left: 0; top: 0; z-index: var(--z-cursor); pointer-events: none; opacity: 0; transition: opacity var(--d-1) var(--ease); }

  border-radius: 50%; border: 1px solid var(--perla);

}
.cursor.has-text .cursor-ring { background: rgba(238, 229, 223, 0.9); border-color: transparent; }
.cursor-text { font-size: 0.68rem; font-weight: 400; letter-spacing: 0.01em; color: var(--tinta); opacity: 0; transform: scale(0.7); transition: opacity var(--d-1) var(--ease), transform var(--d-1) var(--ease); }
.cursor.has-text .cursor-text { opacity: 1; transform: none; }
/* El nativo se oculta solo cuando el cursor personalizado está activo; nunca en campos de texto ni iframes */
html.cursor-on, html.cursor-on body, html.cursor-on a, html.cursor-on button, html.cursor-on [data-cursor], html.cursor-on label, html.cursor-on summary { cursor: none; }

/* ----- Botones magnéticos: el transform lo lleva el JS, sin transición CSS encima ----- */

[data-magnetic-by="nav"] { will-change: transform; }

/* ----- Movimiento reducido ----- */

/* ---- motion.css ---- */
/* ===== Movimiento: estados de revelado (el layout vive en base.css) ===== */

/* Fondo continuo: body interpola --bg por JS; sin transición CSS para no pelear con el scroll */
html.theme-scroll body { transition: none; }

/* Títulos por líneas (SplitText mask:'lines'): solo lo animado lleva will-change */
[data-reveal="lines"].is-split .line { will-change: transform; }
[data-reveal="lines"].is-revealed .line { will-change: auto; }

/* Imágenes: descubierto con clip-path desde el rectángulo áureo (1,44 s expo.out) + leve asentamiento interior */

/* Marquesina: la pista la mueve el ticker de GSAP */

.gift-card.is-live .gift-shine { will-change: background-position; }

/* Parallax suave */
.mo-parallax { will-change: transform; }


/* ---- panel.css ---- */
/* ===== Panel de servicios (overlay circular) + lightbox ===== */
.panel {
  position: fixed; inset: 0; z-index: var(--z-panel);

.panel-close {
  position: fixed; top: var(--s-3); right: var(--gutter); z-index: 2;
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; color: var(--perla);

.panel-nav { display: flex; gap: var(--s-2); }
.panel-navbtn {
  display: inline-flex; align-items: center; gap: var(--s-2); min-height: 40px; padding: 0 var(--s-3);
  border: 1px solid var(--line-2); border-radius: var(--pill); color: var(--fg-2); font-size: var(--fs--1);

}

/* Chips de filtro */
.chips { display: flex; flex-wrap: wrap; gap: var(--s-2); }

.chip {
  min-height: 34px; padding: 0 var(--s-3); border-radius: var(--pill);

.pe.pe-in { animation: pe-in var(--d-3) var(--ease) both; animation-delay: calc(var(--i, 0) * var(--stagger)); }

/* Subgrupos (Corporales) */
.sub { display: flex; flex-direction: column; gap: var(--s-4); }
.sub[hidden] { display: none; }
.sub-title { font-size: var(--fs-3); font-weight: 200; letter-spacing: -0.015em; padding-bottom: var(--s-3); border-bottom: 1px solid var(--line); }

.compact-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-4); }

[role="tabpanel"][hidden] { display: none; }

/* Imagen de costos y estado vacío */
.costos { position: relative; }

.pfig-zoom { position: absolute; right: var(--s-3); bottom: var(--s-3); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(42, 38, 38, 0.7); border: 1px solid var(--line); color: var(--oro-claro); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.empty { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: var(--s-3); padding: var(--s-5); border: 1px solid var(--line-2); border-radius: 4px; overflow: hidden; }

/* Bronceado */
.tan { display: grid; grid-template-columns: minmax(0, 38.2fr) minmax(0, 61.8fr); gap: var(--s-6); align-items: start; }
.tan-fig { max-width: 380px; }
.tan-right { display: flex; flex-direction: column; gap: var(--s-4); }

.acabado { display: flex; align-items: center; gap: var(--s-3); text-align: left; padding: var(--s-3) 0; border-bottom: 1px solid var(--line-2); color: var(--fg-2); transition: color var(--d-1) var(--ease); }

.tan-view { display: flex; flex-direction: column; gap: var(--s-2); padding: var(--s-4); border: 1px solid var(--line-2); border-radius: 4px; }
.tan-price-label { font-size: var(--fs--1); color: var(--fg-2); }
.roll { position: relative; height: 1.1em; font-size: var(--fs-5); line-height: 1; overflow: hidden; color: var(--oro); }
.roll-item { position: absolute; left: 0; top: 0; white-space: nowrap; font-variation-settings: 'opsz' 96; }
.tan-frase { color: var(--fg-2); min-height: 2.6em; max-width: 44ch; }
.tan-view .btn { align-self: flex-start; margin-top: var(--s-2); }
.gal[hidden] { display: none; }
.gal-track { display: flex; gap: var(--s-3); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: var(--s-2); cursor: grab; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.gal-track::-webkit-scrollbar { display: none; }

.gal-btn { flex: 0 0 auto; width: min(58vw, 260px); scroll-snap-align: start; padding: 0; border-radius: var(--radius); cursor: zoom-in; }
.gal-btn:focus-visible { outline-offset: 2px; }
.gal-item { width: 100%; }
.gal-hint { margin-top: var(--s-2); }

/* HIFU */
.hifu { display: flex; flex-direction: column; gap: var(--s-6); }
.prose-p { max-width: 60ch; color: var(--perla); }
.hifu-zonas { display: grid; grid-template-columns: minmax(0, 38.2fr) minmax(0, 61.8fr); gap: var(--s-6); align-items: start; }
.sil { position: relative; aspect-ratio: 2 / 3; max-width: 320px; }
.sil-svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity var(--d-3) var(--ease); }
.sil-svg.is-active { opacity: 1; }
.sil-line { fill: none; stroke: var(--perla); stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; opacity: 0.55; vector-effect: non-scaling-stroke; }
.zp-dot { fill: var(--oro); }
.zp-halo { fill: none; stroke: var(--oro); stroke-width: 0.8; opacity: 0.45; transform-origin: center; transform-box: fill-box; animation: zp-pulse 2.89s var(--ease-io) infinite; animation-delay: calc(var(--i, 0) * 0.34s); }
.zp.is-hot .zp-halo { opacity: 1; stroke-width: 1.2; }
.zp.is-hot .zp-dot { fill: var(--oro-claro); }

.hifu-right { display: flex; flex-direction: column; gap: var(--s-4); }
.zona-list { display: grid; gap: var(--s-2); }
.zona-item { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2) 0; border-bottom: 1px solid var(--line-2); font-weight: 300; }
.zona-item::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--oro); flex: none; }
.hifu-right .btn { align-self: flex-start; }

/* Antes / después */
.ba-sec[hidden] { display: none; }
.ba { --x: 50%; position: relative; aspect-ratio: 1.618 / 1; overflow: hidden; border-radius: var(--radius); border: 1px solid var(--line-2); background: var(--grafito); user-select: none; touch-action: none; cursor: ew-resize; }
.ba img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ba-top { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--x)) 0 0); }
.ba-handle { position: absolute; top: 0; bottom: 0; left: var(--x); width: 1px; background: var(--oro-claro); transform: translateX(-50%); cursor: ew-resize; }
.ba-grip { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; border-radius: 50%; transform: translate(-50%, -50%); background: rgba(42, 38, 38, 0.75); border: 1px solid var(--oro); color: var(--oro-claro); display: flex; align-items: center; justify-content: center; }
.ba-grip .ic-flip { transform: scaleX(-1); }
.ba-label { position: absolute; bottom: var(--s-3); padding: 4px 10px; border-radius: var(--pill); background: rgba(42, 38, 38, 0.7); font-size: 0.74rem; color: var(--perla); }
.ba-label-a { left: var(--s-3); }
.ba-label-d { right: var(--s-3); }

/* Lightbox */
.lightbox { position: fixed; inset: 0; z-index: var(--z-lightbox); background: rgba(35, 31, 31, 0.94); display: flex; flex-direction: column; }
.lightbox[hidden] { display: none; }
.lb-stage { flex: 1; display: grid; place-items: center; overflow: hidden; touch-action: none; cursor: grab; will-change: transform, opacity; }
.lightbox.is-zoomed .lb-stage { cursor: grabbing; }
.lb-img { max-width: min(96vw, 1200px); max-height: 86vh; object-fit: contain; transform-origin: center; will-change: transform; border-radius: var(--radius); }
.lb-close { position: absolute; top: var(--s-3); right: var(--gutter); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--perla); background: rgba(42, 38, 38, 0.6); border: 1px solid var(--line-2); }
.lb-hint { text-align: center; padding: var(--s-3) var(--gutter) calc(var(--s-4) + var(--safe-b)); font-size: 0.78rem; color: var(--fg-2); }

/* ----- Tablet y móvil ----- */
@media (max-width: 1100px) {
  .fichas { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-5) var(--s-4); }
}
@media (max-width: 900px) {
  .panel-inner { grid-template-columns: 1fr; gap: var(--s-5); padding-top: calc(var(--s-6) + var(--s-3)); padding-bottom: calc(var(--s-7) + var(--s-5) + var(--safe-b)); }
  .panel-aside { position: static; gap: var(--s-4); }
  .panel-title { font-size: var(--fs-5); }

  .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); scrollbar-width: none; }

/* ---- hero.css ---- */
/* ===== HERO: preloader, canvas 3D, estados del revelado y pista ===== */

/* ---- Preloader (la caja #preloader y su degradado vienen de base.css) ---- */
.preloader { overflow: hidden; }
.pre-inner {
  position: relative;
  width: min(64vmin, 440px);
  display: grid; place-items: center;
  will-change: transform, opacity;
  transition: transform var(--d-2) var(--ease-io), opacity var(--d-2) var(--ease-io);
}
.pre-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; color: var(--oro); }
.pre-rect { stroke: var(--oro); stroke-width: 0.55; opacity: 0.32; }
.pre-spiral { stroke: var(--oro); stroke-width: 1.35; }
.pre-count {
  position: absolute; transform: translate(-50%, -50%);
  font-size: var(--fs-5); line-height: 1; letter-spacing: -0.02em;
  color: var(--oro-claro); font-variation-settings: 'opsz' 96;
  font-variant-numeric: tabular-nums; min-width: 2.2ch; text-align: center;
  transition: opacity var(--d-1) var(--ease);
}
.pre-phi {
  position: absolute; right: 0; bottom: calc(-1 * var(--s-5));
  font-size: var(--fs--1); color: var(--fg-3);
  transition: opacity var(--d-1) var(--ease);
}
.preloader.is-fading { transition: opacity 0.4s var(--ease-io); opacity: 0; pointer-events: none; }

/* ---- Canvas 3D: cuando la escena existe, el degradado del logo pasa al contenedor fijo y .hero-bg se vuelve transparente ---- */
.hero-canvas-wrap canvas { opacity: 0; will-change: opacity; }
html.hero3d .hero-bg { background: transparent; }
html.hero3d .hero-canvas-wrap {
  background: radial-gradient(120% 90% at 20% 10%, var(--logo-a) 0%, color-mix(in srgb, var(--logo-a) 40%, var(--logo-b)) 45%, var(--logo-b) 100%);
  will-change: opacity;
}
.hero-canvas-wrap.is-off { visibility: hidden; }

/* ---- Capa de contenido: oculta hasta que arranca su animación (solo con GSAP); red de seguridad a los 6 s ---- */
html.gsap .hero-content > :not(.is-in),
html.gsap .hero-stage > .hero-corner:not(.is-in) {
  visibility: hidden;
  animation: hero-safety 0s linear 6s forwards;
}
html.reduced .hero-content > *, html.reduced .hero-stage > .hero-corner { visibility: visible !important; animation: none !important; }
@keyframes hero-safety { to { visibility: visible; } }
.hero-wordmark .wm-path { stroke: var(--oro-claro); stroke-linejoin: round; stroke-linecap: round; }
/* Con escena 3D, las letras las dibujan las partículas: la caja del SVG solo conserva el sitio */
html.hero3d .wordmark-hero { opacity: 0; }
.hero-title .hero-line { will-change: transform; }
.hero-actions .btn { will-change: clip-path; }

/* ---- Interacción táctil: mantener presionado no debe seleccionar texto ni abrir menús ---- */
html.touch.hero3d .hero-stage { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
html.hero3d .hero-stage { touch-action: pan-y; }

/* ===== Navegación: Lenis + bus de scroll, header, dock, menú de servicios, progreso, cursor, magnéticos ===== */
(() => {
  const { h, icon, qs, qsa, clamp, lerp, on, emit } = Aurea;
  const root = document.documentElement;
  const DESKTOP = '(min-width: 768px)';
  const isDesktop = () => window.matchMedia(DESKTOP).matches;

  /* Secciones que puede marcar el dock (en el orden de la página) */
  const SECTIONS = ['inicio', 'que-es', 'luza-finol', 'servicios', 'cirugia-plastica', 'dermatologia', 'cardiologia', 'informacion', 'footer'];

  /* Estado compartido del módulo */
  const S = { y: 0, vel: 0, dir: 0, progress: 0, active: null, panelOpen: false, menuOpen: false };

  /* ---------------------------------------------------------------- */
  /* Posición natural de un elemento (ignora el desplazamiento sticky) */
  function naturalTop(el) {
    let node = el, sticky = null;
    while (node && node !== document.body) { if (getComputedStyle(node).position === 'sticky') sticky = node; node = node.parentElement; }
    const rect = el.getBoundingClientRect();
    if (!sticky) return rect.top + window.scrollY;
    const p = sticky.parentElement, pr = p.getBoundingClientRect(), cs = getComputedStyle(p);
    const gap = parseFloat(cs.rowGap) || 0;
    let y = pr.top + window.scrollY + (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.borderTopWidth) || 0);
    for (const sib of p.children) { if (sib === sticky) break; y += sib.offsetHeight + gap; }
    return y + (rect.top - sticky.getBoundingClientRect().top);
  }
  const maxScroll = () => Math.max(1, root.scrollHeight - window.innerHeight);

  /* ================================================================ */
  /* 1. Lenis + bus de scroll                                          */
  /* ================================================================ */
  function setupScroll() {
    const F = Aurea.flags;
    let lenis = null;
    if (F.lenis && !F.reduced) {
      try {
        lenis = new Lenis({ lerp: 0.1, smoothWheel: true, anchors: true });
        if (F.gsap && window.ScrollTrigger) {
          lenis.on('scroll', ScrollTrigger.update);
          gsap.ticker.add((t) => lenis.raf(t * 1000));
          gsap.ticker.lagSmoothing(0);
        } else {
          const raf = (t) => { lenis.raf(t); requestAnimationFrame(raf); };
          requestAnimationFrame(raf);
        }
        lenis.on('scroll', (l) => publish(l.scroll, l.velocity, l.direction, l.progress));
      } catch (e) { lenis = null; console.warn('[nav] Lenis no disponible:', e); }
    }
    Aurea.lenis = lenis;

    /* Sin Lenis: rAF propio sobre window.scrollY (solo emite mientras hay movimiento) */
    if (!lenis) {
      let last = window.scrollY, raw = 0, raf = 0;
      const tick = () => {
        raf = 0;
        const y = window.scrollY;
        raw = y - last; last = y;
        publish(y, raw, raw > 0 ? 1 : raw < 0 ? -1 : S.dir, y / maxScroll());
        /* sigue solo mientras la velocidad suavizada no se asienta */
        if (raw !== 0 || Math.abs(S.vel) > 0.05) raf = requestAnimationFrame(tick);
      };
      const kick = () => { if (!raf && !document.hidden) raf = requestAnimationFrame(tick); };
      window.addEventListener('scroll', kick, { passive: true });
      kick();
    }

    on('lenis:stop', () => { if (lenis) lenis.stop(); else root.classList.add('nav-stopped'); });
    on('lenis:start', () => { if (lenis) lenis.start(); else root.classList.remove('nav-stopped'); });

    /* Desplazamiento suave a un destino: selector, elemento o número */
    Aurea.scrollTo = (target, opts) => {
      const o = Object.assign({ offset: 0, immediate: false }, opts || {});
      let y;
      if (typeof target === 'number') y = target;
      else {
        const el = typeof target === 'string' ? (() => { try { return qs(target); } catch (e) { return null; } })() : target;
        if (!el) return false;

      else window.scrollTo({ top: y, behavior: (o.immediate || F.reduced) ? 'auto' : 'smooth' });
      return true;
    };

    /* Enlaces internos <a href="#id"> → scroll suave + hash con replaceState */
    document.addEventListener('click', (e) => {
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const a = e.target.closest && e.target.closest('a[href^="#"]');
      if (!a || a.hasAttribute('aria-haspopup') || a.closest('.dock-menu')) return;
      const id = decodeURIComponent(a.getAttribute('href').slice(1));

      const el = document.getElementById(id);

  /* ================================================================ */
  /* 2. Header                                                          */
  /* ================================================================ */
  function setupHeader() {

    };

      else if (it.wa) btn = h('a', { class: 'dock-btn dock-wa', href: Aurea.wa(), target: '_blank', rel: 'noopener', 'aria-label': it.label, 'data-dock': it.id }, icon(it.icon, 22));
      else btn = h('a', { class: 'dock-btn', href: it.href, 'aria-label': it.label, 'data-dock': it.id }, icon(it.icon, 22));
      const li = h('li', { class: `dock-item${it.wa ? ' dock-item-wa' : ''}` }, btn, tip);
      list.appendChild(li);
      items.push({ it, li, btn, s: 1, t: 1 });
    });
    const dock = h('nav', { id: 'dock', class: 'dock', 'aria-label': 'Navegación rápida' }, list);
    uiRoot.appendChild(dock);

    /* Entrada tras el preloader (o a los 400 ms) */
    let shown = false;
    const show = () => { if (shown) return; shown = true; dock.classList.add('is-in'); };
    on('preloader:done', show);
    setTimeout(show, root.classList.contains('no-preloader') ? 60 : 400);
    on('panel:open', () => { S.panelOpen = true; dock.classList.add('is-away'); closeMenu(false); });
    on('panel:close', () => { S.panelOpen = false; dock.classList.remove('is-away'); });

    /* Activo según la sección visible */
    const ACTIVE_MAP = { servicios: 'servicios', 'cirugia-plastica': 'cirugia-plastica', dermatologia: 'dermatologia', cardiologia: 'cardiologia', informacion: 'informacion' };
    on('section:active', ({ id }) => {
      const target = ACTIVE_MAP[id] || null;
      items.forEach(({ it, btn }) => {
        const act = it.id === target;
        btn.classList.toggle('is-active', act);
        if (act) btn.setAttribute('aria-current', 'true'); else btn.removeAttribute('aria-current');
      });
    });

    /* Magnificación tipo dock (solo escritorio, puntero fino, sin reduced) */
    if (F.finePointer && !F.reduced) {
      const W = 44, SIGMA = 62, MAX = 0.42, BASE_PAD = 13;
      let mx = null, raf = 0;
      const frame = () => {
        raf = 0;
        let moving = false, spread = 0;
        items.forEach((o) => {
          if (mx !== null) {
            const r = o.btn.getBoundingClientRect();
            const c = r.left + r.width / 2;
            const d = (c - mx) / SIGMA;
            o.t = 1 + MAX * Math.exp(-d * d);
          } else o.t = 1;
          o.s = lerp(o.s, o.t, 0.22);
          if (Math.abs(o.s - o.t) > 0.002) moving = true; else o.s = o.t;
          spread += (o.s - 1) * W;
        });
        /* Cada ítem se desplaza para dar espacio al vecino magnificado */
        let acc = 0;
        const half = spread / 2;
        items.forEach((o) => {
          const extra = (o.s - 1) * W;
          const tx = acc + extra / 2 - half;
          acc += extra;
          o.li.style.transform = tx ? `translateX(${tx.toFixed(2)}px)` : '';
          o.btn.style.transform = o.s !== 1 ? `translateY(${(-(o.s - 1) * 18).toFixed(2)}px) scale(${o.s.toFixed(3)})` : '';
        });
        list.style.paddingInline = spread > 0.5 ? `${(BASE_PAD + half).toFixed(2)}px` : '';
        if (moving) raf = requestAnimationFrame(frame);
      };
      const kick = () => { if (!raf) raf = requestAnimationFrame(frame); };
      dock.addEventListener('pointermove', (e) => { if (!isDesktop() || e.pointerType !== 'mouse') return; mx = e.clientX; kick(); });
      dock.addEventListener('pointerleave', () => { mx = null; kick(); });
      window.addEventListener('resize', () => { if (!isDesktop()) { mx = null; kick(); } });
    }

    /* Menú de servicios */
    const menu = buildMenu(uiRoot);
    items[0].btn.addEventListener('click', (e) => { e.preventDefault(); if (S.menuOpen) closeMenu(true); else openMenu(); });
    items[0].btn.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); openMenu(); }
    });

    function openMenu() {
      if (S.menuOpen) return;
      S.menuOpen = true;
      positionMenu();
      menu.el.hidden = false;
      menu.el.classList.remove('is-closing');
      items[0].btn.setAttribute('aria-expanded', 'true');
      requestAnimationFrame(() => { menu.el.classList.add('is-open'); });
      menu.focusIndex(0);
      document.addEventListener('pointerdown', onOutside, true);
      document.addEventListener('keydown', onMenuKey);
      window.addEventListener('resize', positionMenu);
    }
    function closeMenu(refocus) {
      if (!S.menuOpen) return;
      S.menuOpen = false;
      items[0].btn.setAttribute('aria-expanded', 'false');
      menu.el.classList.remove('is-open');
      menu.el.classList.add('is-closing');
      const done = () => { if (!S.menuOpen) { menu.el.hidden = true; menu.el.classList.remove('is-closing'); } };
      if (F.reduced) done(); else setTimeout(done, 240);
      document.removeEventListener('pointerdown', onOutside, true);
      document.removeEventListener('keydown', onMenuKey);
      window.removeEventListener('resize', positionMenu);
      if (refocus) items[0].btn.focus({ preventScroll: true });
    }
    function onOutside(e) { if (!menu.el.contains(e.target) && !items[0].li.contains(e.target)) closeMenu(false); }
    function onMenuKey(e) {
      const n = menu.buttons.length;
      const i = menu.buttons.indexOf(document.activeElement);
      switch (e.key) {
        case 'Escape': e.preventDefault(); closeMenu(true); break;
        case 'ArrowDown': case 'ArrowRight': e.preventDefault(); menu.focusIndex((i + 1) % n); break;
        case 'ArrowUp': case 'ArrowLeft': e.preventDefault(); menu.focusIndex((i - 1 + n) % n); break;
        case 'Home': e.preventDefault(); menu.focusIndex(0); break;
        case 'End': e.preventDefault(); menu.focusIndex(n - 1); break;
        case 'Tab': e.preventDefault(); closeMenu(true); break;
        default: break;
      }
    }
    function positionMenu() {
      if (!isDesktop()) { menu.el.style.left = ''; menu.el.style.transform = ''; menu.box.style.transformOrigin = ''; return; }
      const r = items[0].btn.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const w = menu.el.offsetWidth || 360;
      const left = clamp(cx - w / 2, 13, window.innerWidth - w - 13);
      menu.el.style.left = `${left}px`;
      menu.el.style.transform = 'none';
      menu.box.style.transformOrigin = `${clamp(cx - left, 20, w - 20)}px 100%`;
    }
    menu.onPick = (id, x, y) => { closeMenu(true); emit('open:categoria', { id, x, y }); };
    menu.onAll = () => { closeMenu(false); Aurea.scrollTo('#servicios'); try { history.replaceState(null, '', '#servicios'); } catch (e) { /* file:// */ } };

    return dock;
  }

  /* Popover con las seis categorías */
  function buildMenu(uiRoot) {
    const cats = (typeof AUREA !== 'undefined' && AUREA.categorias) || [];
    const buttons = [];
    const api = { onPick: null, onAll: null };
    const listEl = h('div', { class: 'dock-menu-list', role: 'none' });
    cats.forEach((c, i) => {
      const min = Aurea.desde ? Aurea.desde(c) : null;
      const b = h('button', { type: 'button', role: 'menuitem', class: 'dock-menu-item', tabindex: '-1', 'data-cat': c.id },
        h('span', { class: 'dock-menu-icon' }, icon(c.icono, 22)),
        h('span', { class: 'dock-menu-name', text: c.nombre }),
        min !== null ? h('span', { class: 'dock-menu-from' }, 'desde', h('span', { class: 'num', text: Aurea.precio(min) })) : h('span', { class: 'dock-menu-from', text: 'Ver costos' }));
      b.style.setProperty('--i', i);
      b.addEventListener('click', (e) => {
        const r = b.getBoundingClientRect();
        const x = e.clientX || r.left + r.width / 2, y = e.clientY || r.top + r.height / 2;
        api.onPick && api.onPick(c.id, x, y);
      });
      buttons.push(b);
      listEl.appendChild(b);
    });
    const all = h('a', { class: 'dock-menu-all', href: '#servicios', role: 'menuitem', tabindex: '-1', text: 'Ver la sección' });
    all.addEventListener('click', (e) => { e.preventDefault(); api.onAll && api.onAll(); });
    buttons.push(all);
    const box = h('div', { class: 'dock-menu-box' },
      h('div', { class: 'dock-menu-head' }, h('span', { class: 'dock-menu-title', id: 'dock-menu-title', text: 'Servicios' }), all),
      listEl);
    const el = h('div', { class: 'dock-menu', id: 'dock-menu', role: 'menu', 'aria-labelledby': 'dock-menu-title', hidden: true }, box);
    uiRoot.appendChild(el);
    api.el = el; api.box = box; api.buttons = buttons;
    api.focusIndex = (i) => { const b = buttons[i]; if (b) b.focus({ preventScroll: true }); };
    return api;
  }

  /* ================================================================ */
  /* 5. Indicador de progreso                                          */
  /* ================================================================ */
  function setupProgress(uiRoot) {
    const svg = Aurea.spiralSVG(44, { turns: 3, width: 1 });
    const path = svg.querySelector('.spiral-path');
    /* Pista tenue detrás del trazo que se dibuja */
    const track = path.cloneNode(); track.classList.remove('spiral-path'); track.classList.add('spiral-track'); svg.insertBefore(track, path);
    const wrap = h('div', { class: 'progress', 'aria-hidden': 'true' }, svg);
    uiRoot.appendChild(wrap);
    let L = 0;
    const measure = () => { try { L = path.getTotalLength(); } catch (e) { L = 200; } path.style.strokeDasharray = `${L}`; path.style.strokeDashoffset = `${L}`; };
    measure();
    on('scroll', ({ progress }) => {
      if (!L) measure();
      path.style.strokeDashoffset = `${(L * (1 - progress)).toFixed(2)}`;
      wrap.classList.toggle('is-on', progress > 0.03 && S.active !== 'inicio');
    });
    on('section:active', () => wrap.classList.toggle('is-on', S.progress > 0.03 && S.active !== 'inicio'));
    on('panel:open', () => wrap.classList.remove('is-on'));
  }

  /* ================================================================ */
  /* 6. Cursor personalizado                                            */
  /* ================================================================ */
  function setupCursor(uiRoot) {
    const F = Aurea.flags;
    if (!F.finePointer || F.reduced) return;
    const text = h('span', { class: 'cursor-text' });
    const dot = h('div', { class: 'cursor-dot' });
    const ring = h('div', { class: 'cursor-ring' }, text);
    const cur = h('div', { class: 'cursor', 'aria-hidden': 'true' }, dot, ring);
    uiRoot.appendChild(cur);
    root.classList.add('cursor-on');

    const INTERACTIVE = 'a, button, [data-cursor], .dock, .cat, label, summary, [role="button"], [role="menuitem"], input[type="range"]';
    const NATIVE = 'input, textarea, select, [contenteditable], iframe';
    let x = window.innerWidth / 2, y = window.innerHeight / 2, rx = x, ry = y, scale = 1, ts = 1, raf = 0, seen = false, down = false, over = false;

    const frame = () => {
      raf = 0;
      rx = lerp(rx, x, 0.2); ry = lerp(ry, y, 0.2);
      scale = lerp(scale, ts, 0.2);
      dot.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      ring.style.transform = `translate3d(${rx.toFixed(2)}px, ${ry.toFixed(2)}px, 0) scale(${scale.toFixed(3)})`;
      if (Math.abs(rx - x) > 0.1 || Math.abs(ry - y) > 0.1 || Math.abs(scale - ts) > 0.002) raf = requestAnimationFrame(frame);
    };
    const kick = () => { if (!raf) raf = requestAnimationFrame(frame); };
    const setTarget = () => { ts = down ? 0.8 : over ? 1.6 : 1; kick(); };

    window.addEventListener('pointermove', (e) => {
      if (e.pointerType && e.pointerType !== 'mouse') { cur.classList.remove('is-visible'); return; }
      x = e.clientX; y = e.clientY;
      if (!seen) { seen = true; rx = x; ry = y; }
      cur.classList.add('is-visible'); cur.classList.remove('is-hidden');
      kick();
    }, { passive: true });
    document.addEventListener('mouseleave', () => cur.classList.remove('is-visible'));
    document.addEventListener('mouseenter', () => { if (seen) cur.classList.add('is-visible'); });
    window.addEventListener('blur', () => cur.classList.remove('is-visible'));
    window.addEventListener('pointerdown', (e) => { if (e.pointerType === 'mouse') { down = true; setTarget(); } });
    window.addEventListener('pointerup', () => { down = false; setTarget(); });
    document.addEventListener('mouseover', (e) => {
      const t = e.target;
      if (!(t instanceof Element)) return;
      if (t.closest(NATIVE)) { cur.classList.add('is-hidden'); over = false; setTarget(); return; }
      cur.classList.remove('is-hidden');
      const it = t.closest(INTERACTIVE);
      over = !!it;
      const label = it && it.closest('[data-cursor]');
      const txt = label && !S.panelOpen ? label.dataset.cursor : '';
      text.textContent = txt || '';
      cur.classList.toggle('has-text', !!txt);
      setTarget();
    });
    on('panel:open', () => { cur.classList.remove('has-text'); text.textContent = ''; });
  }

  /* ================================================================ */
  /* 7. Botones magnéticos [data-magnetic]                              */
  /* ================================================================ */
  function setupMagnetic() {
    const F = Aurea.flags;
    if (!F.finePointer || F.reduced) return;
    const RANGE = 60, MAX = 8;
    const els = [];
    const claim = (el) => { if (el.dataset.magneticBy) return; el.dataset.magneticBy = 'nav'; els.push({ el, x: 0, y: 0, tx: 0, ty: 0 }); };
    qsa('[data-magnetic]').forEach(claim);
    /* Elementos que otros módulos añadan después */
    const mo = new MutationObserver(() => qsa('[data-magnetic]:not([data-magnetic-by])').forEach(claim));
    mo.observe(document.body, { childList: true, subtree: true });

    let raf = 0, px = -1e4, py = -1e4;
    const frame = () => {
      raf = 0; let moving = false;
      els.forEach((o) => {
        o.x = lerp(o.x, o.tx, 0.18); o.y = lerp(o.y, o.ty, 0.18);
        if (Math.abs(o.x - o.tx) > 0.05 || Math.abs(o.y - o.ty) > 0.05) moving = true; else { o.x = o.tx; o.y = o.ty; }
        o.el.style.transform = (o.x || o.y) ? `translate3d(${o.x.toFixed(2)}px, ${o.y.toFixed(2)}px, 0)` : '';
      });
      if (moving) raf = requestAnimationFrame(frame);
    };
    const kick = () => { if (!raf) raf = requestAnimationFrame(frame); };
    const eval_ = () => {
      els.forEach((o) => {
        if (!o.el.isConnected) { o.tx = o.ty = 0; return; }
        const r = o.el.getBoundingClientRect();
        if (!r.width) { o.tx = o.ty = 0; return; }
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        /* distancia al borde del botón */
        const dx = Math.max(Math.abs(px - cx) - r.width / 2, 0), dy = Math.max(Math.abs(py - cy) - r.height / 2, 0);
        const dist = Math.hypot(dx, dy);
        if (dist < RANGE) {
          const k = 1 - dist / RANGE; /* 1 encima, 0 al borde del alcance */
          const ang = Math.atan2(py - cy, px - cx);
          const m = MAX * Math.pow(k, 0.6);
          o.tx = Math.cos(ang) * m * clamp(Math.abs(px - cx) / (r.width / 2 + RANGE), 0, 1) * 1.6;
          o.ty = Math.sin(ang) * m * clamp(Math.abs(py - cy) / (r.height / 2 + RANGE), 0, 1) * 1.6;
          o.tx = clamp(o.tx, -MAX, MAX); o.ty = clamp(o.ty, -MAX, MAX);
        } else { o.tx = 0; o.ty = 0; }
      });
      kick();
    };
    let pending = false;
    window.addEventListener('pointermove', (e) => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      px = e.clientX; py = e.clientY;
      if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; eval_(); }); }
    }, { passive: true });
    document.addEventListener('mouseleave', () => { px = py = -1e4; eval_(); });
    on('scroll', () => { if (px > -1e3) eval_(); });
  }

  /* ================================================================ */
  Aurea.register('nav', () => {
    const uiRoot = qs('#ui-root') || document.body.appendChild(h('div', { id: 'ui-root' }));
    setupScroll();
    setupHeader();
    setupSections();
    setupDock(uiRoot);
    setupProgress(uiRoot);
    setupCursor(uiRoot);
    setupMagnetic();
  });
})();


/* ---- motion.js ---- */
/* ===== Movimiento: fondo continuo, revelados, cifras, marquesina, apilado, tarjeta de regalo ===== */
(() => {
  const { qs, qsa, clamp, lerp, on, probe } = Aurea;
  const root = document.documentElement;
  const body = document.body;

  /* Colores de zona (tokens) */
  const COLOR = { dark: '#2A2626', light: '#EEE5DF' };
  const DUR = { d1: 0.34, d2: 0.55, d3: 0.89, d4: 1.44 };
  const EASE = 'expo.out';
  const STAGGER = 0.055;

  /* Formato es-VE con punto de miles (Intl no agrupa 4 cifras en español) */
  const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

  /* Fuentes listas (con red de seguridad para no dejar títulos ocultos) */
  const fontsReady = () => Promise.race([
    (document.fonts && document.fonts.ready) || Promise.resolve(),
    new Promise((r) => setTimeout(r, 1800))
  ]);

  /* Estado final sin animar: revelados instantáneos y cifras completas */
  function showAllStatic() {
    qsa('[data-reveal="lines"]').forEach((el) => el.classList.add('is-split', 'is-revealed'));
    qsa('.fig-reveal').forEach((el) => el.classList.add('is-revealed'));
    qsa('.cifra-valor[data-count]').forEach((el) => {
      const num = el.querySelector('.cifra-num');
      if (num) num.textContent = `${fmt(Number(el.dataset.count) || 0)}${el.dataset.suffix || ''}`;
      else el.textContent = `${el.dataset.prefix || ''}${fmt(Number(el.dataset.count) || 0)}${el.dataset.suffix || ''}`;
    });
  }

  /* ------------------------------------------------------------------ */
  /* Fondo continuo: body --bg interpolado según la zona siguiente        */
  /* ------------------------------------------------------------------ */
  function setupBackground() {
    const zones = qsa('main > [data-theme], body > footer[data-theme]');
    if (!zones.length) return;
    root.classList.add('theme-scroll');
    const colorOf = (z) => COLOR[z.dataset.theme === 'light' ? 'light' : 'dark'];
    const mix = gsap.utils.interpolate;
    let tops = [];
    let current = '';

    const measure = () => {
      const y = window.scrollY || window.pageYOffset || 0;
      tops = zones.map((z) => z.getBoundingClientRect().top + y);
    };

    /* Colores de texto por tema: las dos zonas que comparten la transición los interpolan para no perder contraste */
    const FG = {
      dark: { fg: [238, 229, 223, 1], fg2: [238, 229, 223, 0.66], fg3: [238, 229, 223, 0.6] },
      light: { fg: [35, 31, 31, 1], fg2: [35, 31, 31, 0.68], fg3: [35, 31, 31, 0.65] }
    };
    const rgba = (c) => `rgba(${Math.round(c[0])}, ${Math.round(c[1])}, ${Math.round(c[2])}, ${c[3].toFixed(3)})`;
    const mixC = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
    const lum = (col) => { const m = String(col).match(/\d+(\.\d+)?/g) || [42, 38, 38]; const f = (v) => { v = Number(v) / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(m[0]) + 0.7152 * f(m[1]) + 0.0722 * f(m[2]); };
    const setFg = (z, t) => {
      const k = Math.round(t * 1000);
      if (z._fgT === k) return; z._fgT = k;
      const own = z.dataset.theme === 'light' ? 1 : 0;
      /* Con su propio tema, manda el CSS; en cualquier otro punto se fija el color mezclado (también en los extremos) */
      if (Math.abs(t - own) < 0.001) { z.style.removeProperty('--fg'); z.style.removeProperty('--fg-2'); z.style.removeProperty('--fg-3'); return; }
      z.style.setProperty('--fg', rgba(mixC(FG.dark.fg, FG.light.fg, t)));
      z.style.setProperty('--fg-2', rgba(mixC(FG.dark.fg2, FG.light.fg2, t)));
      z.style.setProperty('--fg-3', rgba(mixC(FG.dark.fg3, FG.light.fg3, t)));
    };
    const paint = () => {
      const y = window.scrollY || window.pageYOffset || 0;
      const vh = window.innerHeight || 800;
      /* La transición dura ~50 vh centrada en el borde: empieza con el borde superior de la zona siguiente a 70 vh y termina a 20 vh */
      let color = colorOf(zones[0]);
      let edge = -1;
      for (let i = 1; i < zones.length; i++) {
        const rel = tops[i] - y;                 // borde superior respecto al viewport
        let p = clamp((vh * 0.7 - rel) / (vh * 0.5), 0, 1);
        if (p <= 0) break;
        p = p * p * p * (p * (p * 6 - 15) + 10); // suavizado: continuo, pero el estado mixto dura poco
        color = p >= 1 ? colorOf(zones[i]) : mix(color, colorOf(zones[i]), p);
        if (p > 0 && p < 1) edge = i;
      }
      if (color !== current) {
        current = color; body.style.setProperty('--bg', color);
        /* El texto de las dos zonas colindantes pasa de perla a tinta justo cuando el fondo cruza la luminancia media */
        const t = clamp((lum(color) - 0.13) / (0.26 - 0.13), 0, 1);
        zones.forEach((z, i) => { const inEdge = edge > 0 && (i === edge || i === edge - 1); setFg(z, inEdge ? t : (z.dataset.theme === 'light' ? 1 : 0)); });
      }
    };

    measure(); paint();
    ScrollTrigger.create({ start: 0, end: 'max', onUpdate: paint, onRefresh: () => { measure(); paint(); } });
    window.addEventListener('resize', () => { measure(); paint(); }, { passive: true });
    /* El bus 'scroll' (NAV/Lenis) también repinta: asegura continuidad aunque el scroll sea suavizado */
    on('scroll', paint);
  }

  /* ------------------------------------------------------------------ */
  /* Revelados: títulos por líneas y figuras con clip-path               */
  /* ------------------------------------------------------------------ */
  function setupReveals() {
    const canSplit = typeof SplitText !== 'undefined';
    qsa('[data-reveal="lines"]').forEach((el) => {
      if (el.closest('#inicio, #preloader')) return;
      if (!canSplit) { el.classList.add('is-split', 'is-revealed'); return; }
      el.classList.add('is-split');
      SplitText.create(el, {
        type: 'lines', mask: 'lines', linesClass: 'line', autoSplit: true,
        onSplit(self) {
          if (el.classList.contains('is-revealed')) { gsap.set(self.lines, { yPercent: 0 }); return; }
          return gsap.from(self.lines, {
            yPercent: 110, duration: DUR.d3, ease: EASE, stagger: STAGGER,
            scrollTrigger: { trigger: el, start: 'top 85%', once: true },
            onComplete: () => el.classList.add('is-revealed')
          });
        }
      });
    });

    /* Figuras: la transición de clip-path vive en motion.css (1,44 s expo.out); aquí solo el disparo */
    qsa('.fig-reveal').forEach((fig) => {
      if (fig.closest('#inicio')) return;
      ScrollTrigger.create({ trigger: fig, start: 'top 85%', once: true, onEnter: () => fig.classList.add('is-revealed') });
    });
  }

  /* ------------------------------------------------------------------ */
  /* ¿Qué es?: palabras que se encienden con el scroll (scrub)           */
  /* ------------------------------------------------------------------ */
  function setupHighlight() {

  /* ------------------------------------------------------------------ */
  /* Marquesina: bucle continuo cuya velocidad y sentido siguen al scroll */
  /* ------------------------------------------------------------------ */
  function setupMarquee() {
    const wrap = qs('#marquesina'), track = qs('#marquesina .marquee-track');
    if (!wrap || !track) return;
    const BASE = 42;               // px/s en reposo
    let half = 0, x = 0, vel = 0, dir = -1, boost = 0, lastT = 0, active = false;
    const measure = () => { half = track.offsetWidth / 2; };
    measure();
    window.addEventListener('resize', measure, { passive: true });

    /* Velocidad de scroll (px/s) medida sobre las muestras que llegan (bus 'scroll' o scroll nativo) */
    let lastY = window.scrollY || 0, lastSampleT = performance.now(), busSeen = false;
    const sample = (y) => {
      const now = performance.now(), dt = now - lastSampleT;
      if (dt < 8) return;
      vel = clamp(((y - lastY) / dt) * 1000, -6000, 6000);
      lastY = y; lastSampleT = now;
    };
    on('scroll', (d) => { busSeen = true; sample(typeof d?.y === 'number' ? d.y : window.scrollY); });
    window.addEventListener('scroll', () => { if (!busSeen) sample(window.scrollY); }, { passive: true });

      const now = t * 1000;
      const dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 1 / 60;
      lastT = now;
      /* Si no llegan muestras, la velocidad decae */
      if (now - lastSampleT > 120) vel *= 0.9;

      boost = lerp(boost, clamp(Math.abs(vel) / 500, 0, 5), 1 - Math.pow(0.02, dt));
